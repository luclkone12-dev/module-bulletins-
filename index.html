<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bulletins Néhémie</title>
<meta name="theme-color" content="#13294b">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --paper:#eef2f7;--surface:#fff;--surface-2:#f6f8fb;--ink:#152335;--muted:#56677d;--line:#d5dde8;
  --accent:#1d4f91;--accent-ink:#fff;--accent-soft:#e2ebf7;
  --head:#13294b;--head-ink:#f2f6fb;--head-muted:#a9bbd4;
  --good:#1d7446;--bad:#c2352a;--warn:#9a6200;--warn-soft:#fbf0d9;--good-soft:#e4f3ea;
  --display:"Bitter",Georgia,serif;--body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;--r:10px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0d141e;--surface:#162131;--surface-2:#1b293b;--ink:#e5ecf5;--muted:#9db0c7;--line:#2b3a4f;
  --accent:#7fb2f2;--accent-ink:#0d1a2c;--accent-soft:#1d3555;--head:#0a1626;--head-ink:#eef3fa;--head-muted:#8fa6c4;
  --good:#5fd093;--bad:#ff8277;--warn:#e8b65a;--warn-soft:#3a2e15;--good-soft:#15301f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:860px;margin:0 auto;padding:12px 16px;display:grid;gap:8px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand h1{font-family:var(--display);font-size:1.1rem;margin:0}
.who{font-size:.85rem;color:var(--head-muted)}
.status{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--head-muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--good);display:inline-block}
.dot.off{background:var(--warn)}
.pod{list-style:none;margin:0;padding:0;display:grid}
.pod li{display:grid;grid-template-columns:3.2rem 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line);min-width:0}
.pod li:first-child{border-top:0}.pod-r{font-weight:700;font-variant-numeric:tabular-nums}.pod-n{min-width:0;overflow-wrap:anywhere}.pod-m{font-variant-numeric:tabular-nums}
.stat th[scope=row]{text-align:left;text-transform:none;letter-spacing:0;font-size:.9rem;color:var(--ink);background:transparent;font-weight:600}
.doc table.st-print th,.doc table.st-print td{padding:4px 3px;font-size:.88em}
.pres{display:grid;gap:8px}.pres h2{margin:0}
.pres-l{list-style:none;margin:0;padding:0;display:grid}
.pres-l li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);min-width:0}
.pres-t{min-width:0;overflow-wrap:anywhere}.pres-h{white-space:nowrap;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;color:var(--head-muted);padding:8px 7px;font-size:.93rem;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--head-ink);border-bottom-color:var(--accent)}
main{max-width:860px;margin:0 auto;padding:16px 16px 56px;display:grid;gap:14px}
h2{font-family:var(--display);font-size:1.15rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:.88rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;padding-inline:6px}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.92rem}
.btn.light{background:rgba(255,255,255,.12);border-color:transparent;color:var(--head-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;min-width:0}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:.85rem;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;min-height:44px;width:100%}
.field textarea{font:inherit;color:inherit;resize:vertical;line-height:1.5}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer;font-weight:600;font-size:.93rem}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{display:grid;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:grid;grid-template-columns:2.4rem 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .no{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.li b{overflow-wrap:anywhere}
.badge{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.badge.ok{color:var(--good)}
.notice{border-radius:var(--r);padding:12px 14px;background:var(--accent-soft);display:grid;gap:4px}
.notice.warn{background:var(--warn-soft)}
.err{color:var(--bad);font-weight:600}
.noteinp{width:4.8rem;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;min-height:44px;font-variant-numeric:tabular-nums}
.noteinp.bad{border-color:var(--bad);outline:2px solid var(--bad)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--surface-2)}
td.n,th.n{text-align:right}
tbody tr:last-child td{border-bottom:0}
tr.disp td{color:var(--muted)}
td input[type=checkbox]{width:22px;height:22px}
.nm{min-width:6.5rem;font-weight:600}
@media (max-width:520px){.tw th,.tw td{padding:6px 4px}.tw .noteinp{width:3.6rem;padding:6px}.tw th{font-size:.68rem;letter-spacing:.02em}}
.low{color:var(--bad);font-weight:700}.hi{color:var(--good);font-weight:700}
.login{max-width:380px;margin:8vh auto 0;width:100%}
.feed .li{grid-template-columns:3.4rem 1fr}
.feed .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;text-align:left}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px;border-radius:8px;background:var(--warn-soft)}
/* Bulletin papier : blanc et encre noire dans les deux thèmes */
.doc-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
.doc{min-width:640px;background:#fff;color:#111;padding:20px 18px;font-family:"Times New Roman",Times,serif;font-size:14px;display:grid;gap:12px;align-content:start}
.doc table{border-collapse:collapse;width:100%;border:1.5px solid #111}
.doc th,.doc td{border:1px solid #111;padding:5px 7px;color:#111;background:#fff;font-size:inherit;line-height:1.25;text-transform:none;letter-spacing:0;font-weight:400}
.doc th{font-weight:700;text-align:center;background:#ececec}
.doc th.l{text-align:left}
.doc td.c{text-align:center}
.doc td.lb{font-weight:700}
.doc .dhead{display:grid;grid-template-columns:80px 1fr 80px;align-items:center;gap:10px;text-align:center}
.doc .dhead img{width:80px;height:80px;object-fit:contain}
.doc .dhead h3{font-family:var(--body);font-size:1.25em;letter-spacing:.03em;margin:0 0 2px}
.doc .it{font-style:italic}.doc .sm{font-size:.86em}
.doc .dfoot{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.doc .dcol{display:grid;gap:10px}
.doc .sigcell{height:70px;vertical-align:top}
.doc .cachet{height:95px;vertical-align:top;font-style:italic;font-size:.86em}
/* Certificat de fréquentation */
.doc.cert{font-size:15px;line-height:1.6;gap:14px;padding:28px 30px}
.cert .ch{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start;text-align:center;font-size:.8em;line-height:1.35}
.cert .ch b{display:block;letter-spacing:.02em}
.cert .ch .tr{display:block;margin:2px 0}
.cert .ch img{width:70px;height:70px;object-fit:contain;margin:6px auto}
.cert .num{font-size:.9em}
.cert .titre{text-align:center;margin:10px 0 6px}
.cert .titre span{display:inline-block;border:2px solid #111;padding:8px 18px;font-weight:700;font-size:1.15em;letter-spacing:.05em}
.cert p{margin:0;text-align:justify}
.cert .id{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 0 20px}
.cert .id b{font-weight:700}
.cert .vide{color:#555}
.cert .sig{justify-self:end;text-align:center;min-width:240px;display:grid;gap:4px;margin-top:10px}
.cert .sig .zone{height:90px}
#print{display:none}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .feuille{break-after:page;page-break-after:always}
  .feuille:last-child{break-after:auto;page-break-after:auto}
  .feuille.deux{display:flex;gap:8mm;height:192mm;overflow:hidden}
  .feuille.deux .doc{flex:1 1 0;min-width:0;padding:0;font-size:8.6pt;gap:2.2mm}
  .feuille.deux .doc th,.feuille.deux .doc td{padding:.6mm 1.2mm}
  .feuille.deux .doc .dhead{grid-template-columns:16mm 1fr 16mm}
  .feuille.deux .doc .dhead img{width:16mm;height:16mm}
  .feuille.deux .doc .sigcell{height:12mm}.feuille.deux .doc .cachet{height:18mm}
  .feuille.un .doc{min-width:0;padding:0;font-size:11pt}
  .feuille.un .doc.cert{font-size:12.5pt;padding:6mm 8mm;gap:5mm}
  .doc,.doc th,.doc td{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* Messages aux parents */
.btn.wa{background:#1b8a4a;border-color:#1b8a4a;color:#fff;text-decoration:none}
.ico{width:18px;height:18px;flex:none}
a.btn{text-decoration:none;color:inherit}
.card.suivi{border-color:var(--warn);background:var(--warn-soft)}
.card.encour{border-color:var(--good);background:var(--good-soft)}
.card.suivi .list,.card.encour .list{background:var(--surface)}
details summary{cursor:pointer;font-weight:600}
.prev{display:grid;gap:6px;justify-items:start}
.prev img{width:min(220px,100%);aspect-ratio:1080/1200;border:1px solid var(--line);border-radius:8px;background:#fff}
.steps{margin:0;padding-left:1.3rem;display:grid;gap:6px}
@media (max-width:560px){.li.m{grid-template-columns:2rem 1fr}.li.m>.row{grid-column:2}}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="head"><div class="brand"><h1>École Néhémie de Katibougou</h1></div></div></header>
<main id="app"><div class="card"><h2>Chargement…</h2></div></main>
<div id="toast" class="toast" hidden></div>
<div id="print"></div>
<style id="pagefmt">@page{size:A4 landscape;margin:8mm}</style>

<script>
/* ===== Configuration (clé publique : les données sont protégées par les règles de la base) ===== */
const SB_URL='https://fdrnjgmuzxiklncyjqio.supabase.co';
const SB_KEY='sb_publishable_r7X0VWRuFgj5rI_YL6z5Yg_JUbWl7nd';
const DOMAINE='@personnel.nehemie';
const ROLES={directeur:'Directeur',secretariat:'Secrétariat',enseignant:'Enseignant'};
const CLASSES=['7e A','7e B','8e A','8e B','9e A','9e B'];
const sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'bn-auth'}}):null;

const S={statsP:null,statsAt:0,statsBusy:false,presents:[],rolesP:{},uid:null,profil:null,annee:'2026-2027',ecole:'École Néhémie de Katibougou',matieres:[],aff:[],eleves:[],evals:[],notes:{},verrous:[],noms:{},
  classe:null,matiere:null,trim:1,tab:'saisie',view:null,draft:null,confirm:null,err:'',bulClasse:null,bulId:null,bulCharge:{},directeur:'',logo:'',
  feed:[],feedAt:null,feedClasse:'',feedErr:'',online:navigator.onLine,syncing:false,lastSync:null,charge:false,busy:false};
const $app=document.getElementById('app');

/* ===== Utilitaires ===== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>typeof v==='number'&&isFinite(v);
const fmt=v=>num(v)?(Math.round(v*100)/100).toFixed(2).replace('.',','):'–';
const fmtN=v=>num(v)?String(Math.round(v*100)/100).replace('.',','):'';
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dateFr=d=>d&&/^\d{4}-\d{2}-\d{2}/.test(d)?d.slice(8,10)+'/'+d.slice(5,7):'';
const heure=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const trimName=t=>t===1?'1er trimestre':t+'e trimestre';
const uuid=()=>(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16)}));
function parseNote(s,max){s=String(s??'').trim().replace(',','.');if(s==='')return null;const v=Number(s);if(!isFinite(v)||v<0||v>max)return NaN;return Math.round(v*100)/100}
const cls=v=>num(v)?(v<10?'low':'hi'):'muted';
const nomEleve=e=>e?((e.nom||'').toUpperCase()+' '+(e.prenom||'')).trim():'Élève';
const matName=id=>(S.matieres.find(m=>m.id===id)||{}).nom||id||'';
const isBureau=()=>S.profil&&(S.profil.role==='directeur'||S.profil.role==='secretariat');
const isDir=()=>S.profil&&S.profil.role==='directeur';
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(_){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(_){return false}}
function lsDel(k){try{localStorage.removeItem(k)}catch(_){}}
const kCache=()=>'bn_cache_'+S.uid,kOut=()=>'bn_outbox_'+S.uid,kSel=()=>'bn_sel_'+S.uid;
const outbox=()=>lsGet(kOut())||[];
const setOutbox=o=>lsSet(kOut(),o);
function estReseau(e){if(!navigator.onLine)return true;const m=String(e&&(e.message||e)||'');return (e instanceof TypeError)||(!e.code&&/fetch|network|load failed|timeout|abort/i.test(m))}
function msgErreur(e){if(e&&e.code==='42501')return 'Accès refusé : ce trimestre est verrouillé, ou cette classe et cette matière ne vous sont pas attribuées.';if(e&&e.code==='23503')return 'Un élève ou une matière n\'existe plus dans la base.';return (e&&e.message)||'Erreur inconnue'}
const chk=r=>{if(r.error)throw r.error;return r.data};

/* ===== Cache sur le téléphone (pour travailler sans réseau) ===== */
function saveCache(){lsSet(kCache(),{profil:S.profil,annee:S.annee,ecole:S.ecole,matieres:S.matieres,aff:S.aff,eleves:S.eleves,evals:S.evals,notes:S.notes,verrous:S.verrous,noms:S.noms,at:S.lastSync})}
function loadCache(){const c=lsGet(kCache());if(!c||!c.profil)return false;Object.assign(S,{profil:c.profil,annee:c.annee||S.annee,ecole:c.ecole||S.ecole,matieres:c.matieres||[],aff:c.aff||[],eleves:c.eleves||[],evals:c.evals||[],notes:c.notes||{},verrous:c.verrous||[],noms:c.noms||{},lastSync:c.at||null});S.charge=true;return true}
function saveSel(){lsSet(kSel(),{classe:S.classe,matiere:S.matiere,trim:S.trim})}

/* ===== Chargement depuis la base ===== */
async function fetchAll(q){let out=[],from=0;for(;;){const d=chk(await q().range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
async function chargerNotes(ids){
  for(let i=0;i<ids.length;i+=80){const part=ids.slice(i,i+80);
    const rows=await fetchAll(()=>sb.from('notes').select('evaluation_id,eleve_id,note,note_classe,dispense').in('evaluation_id',part));
    part.forEach(id=>S.notes[id]={});
    rows.forEach(r=>{(S.notes[r.evaluation_id]||(S.notes[r.evaluation_id]={}))[r.eleve_id]={note:r.note==null?null:Number(r.note),note_classe:r.note_classe==null?null:Number(r.note_classe),dispense:!!r.dispense}})}
}
async function chargerTout(){
  const pr=chk(await sb.from('profils').select('id,identifiant,nom,role,actif').eq('id',S.uid).maybeSingle());
  if(!pr||!pr.actif){const e=new Error('PROFIL');e.code='PROFIL';throw e}
  S.profil=pr;
  const rg=chk(await sb.from('reglages').select('valeur').eq('cle','ecole').maybeSingle());
  if(rg&&rg.valeur){if(rg.valeur.annee)S.annee=rg.valeur.annee;if(rg.valeur.nom)S.ecole=rg.valeur.nom;S.directeur=rg.valeur.directeur||'';S.logo=rg.valeur.logo||''}
  const [mat,aff,el,ev,vr]=await Promise.all([
    fetchAll(()=>sb.from('matieres').select('id,nom,niveaux,coefs,ordre').order('ordre').order('nom')),
    fetchAll(()=>sb.from('affectations').select('user_id,classe,matiere,annee').eq('annee',S.annee)),
    fetchAll(()=>sb.from('eleves').select(champsEl()).order('nom').order('prenom')),
    fetchAll(()=>sb.from('evaluations').select('id,annee,classe,matiere,trimestre,type,titre,date,cree_le').eq('annee',S.annee).order('cree_le')),
    fetchAll(()=>sb.from('verrous').select('annee,classe,trimestre').eq('annee',S.annee))]);
  S.matieres=mat;S.aff=aff;S.eleves=el;S.evals=ev;S.verrous=vr;
  const ids=new Set(ev.map(e=>e.id));Object.keys(S.notes).forEach(k=>{if(!ids.has(k))delete S.notes[k]});
  choisirDefaut();
  if(isBureau()){
    const pf=await fetchAll(()=>sb.from('profils').select('id,nom'));S.noms={};pf.forEach(p=>S.noms[p.id]=p.nom);
    const sel=ev.filter(e=>(e.classe===S.classe&&e.matiere===S.matiere)||(S.tab==='bulletins'&&e.classe===S.bulClasse)).map(e=>e.id);if(sel.length)await chargerNotes(sel);
  }else await chargerNotes(ev.map(e=>e.id));
  S.lastSync=Date.now();S.charge=true;S.online=true;saveCache();
}

/* ===== Vue fusionnée : base + saisies pas encore envoyées ===== */
function vueEvals(){const m=new Map(S.evals.map(e=>[e.id,e]));outbox().forEach(p=>{if(p.kind==='del')m.delete(p.ev.id);else m.set(p.ev.id,{...m.get(p.ev.id),...p.ev})});return [...m.values()]}
function vueNotes(id){const p=outbox().filter(x=>x.ev.id===id&&x.kind==='save').pop();return p?p.notes:(S.notes[id]||null)}
const enAttente=id=>outbox().some(p=>p.ev.id===id);
const elevesOf=c=>S.eleves.filter(e=>e.classe===c).sort((a,b)=>String(a.nom).localeCompare(b.nom,'fr')||String(a.prenom).localeCompare(b.prenom,'fr'));
const estVerrou=(c,t)=>S.verrous.some(v=>v.annee===S.annee&&v.classe===c&&v.trimestre===t);
function mesCours(){
  if(isBureau()){const out=[];CLASSES.forEach(c=>S.matieres.filter(m=>(m.niveaux||[]).includes(c[0])).forEach(m=>out.push({classe:c,matiere:m.id})));return out}
  return S.aff.filter(a=>a.user_id===S.uid&&a.annee===S.annee).map(a=>({classe:a.classe,matiere:a.matiere}))
    .sort((a,b)=>a.classe.localeCompare(b.classe)||matName(a.matiere).localeCompare(matName(b.matiere),'fr'));
}
function choisirDefaut(){
  const sel=lsGet(kSel());if(sel&&!S.classe){S.classe=sel.classe;S.matiere=sel.matiere;S.trim=sel.trim||1}
  const cs=mesCours();
  if(!cs.some(c=>c.classe===S.classe&&c.matiere===S.matiere)){const f=isBureau()?(cs.find(c=>c.classe===S.classe)||cs[0]):cs[0];S.classe=f?f.classe:null;S.matiere=f?f.matiere:null}
}

/* ===== Envoi des saisies ===== */
function mettreEnFile(p){
  const o=outbox(),i=o.findIndex(x=>x.ev.id===p.ev.id);
  if(i>=0){const old=o[i];if(p.kind==='save'&&old.kind==='save'){p.cleared=[...new Set([...(old.cleared||[]),...p.cleared])].filter(id=>!(id in p.notes))}o.splice(i,1)}
  if(p.kind==='del'&&!S.evals.some(e=>e.id===p.ev.id)){setOutbox(o);return} // devoir jamais envoyé : on le retire simplement de la file
  o.push(p);setOutbox(o);
}
async function envoyer(p){
  const id=p.ev.id;
  if(p.kind==='del'){chk(await sb.from('notes').delete().eq('evaluation_id',id));chk(await sb.from('evaluations').delete().eq('id',id));return}
  const ev={id,annee:p.ev.annee,classe:p.ev.classe,matiere:p.ev.matiere,trimestre:p.ev.trimestre,type:p.ev.type,titre:p.ev.titre,date:p.ev.date||null};
  chk(await sb.from('evaluations').upsert(ev,{onConflict:'id'}));
  const rows=Object.entries(p.notes).map(([eid,n])=>({evaluation_id:id,eleve_id:eid,note:n.note,note_classe:n.note_classe??null,dispense:!!n.dispense}));
  if(rows.length)chk(await sb.from('notes').upsert(rows,{onConflict:'evaluation_id,eleve_id'}));
  if(p.cleared&&p.cleared.length)chk(await sb.from('notes').delete().eq('evaluation_id',id).in('eleve_id',p.cleared));
}
function appliquer(p){
  const id=p.ev.id;
  if(p.kind==='del'){S.evals=S.evals.filter(e=>e.id!==id);delete S.notes[id];return}
  const i=S.evals.findIndex(e=>e.id===id),ev={...(S.evals[i]||{cree_le:new Date().toISOString()}),...p.ev};
  if(i>=0)S.evals[i]=ev;else S.evals.push(ev);
  S.notes[id]=JSON.parse(JSON.stringify(p.notes));
}
async function synchroniser(){
  if(S.syncing||!sb||!S.uid)return;
  if(!outbox().some(p=>!p.err))return;
  S.syncing=true;renderHead();
  for(const p of outbox()){
    if(p.err)continue;
    try{await envoyer(p);setOutbox(outbox().filter(x=>x.pid!==p.pid));appliquer(p);S.online=true}
    catch(e){if(estReseau(e)){S.online=false;break}
      const o=outbox(),j=o.findIndex(x=>x.pid===p.pid);if(j>=0){o[j].err=msgErreur(e);setOutbox(o)}}
  }
  S.syncing=false;saveCache();render();
  if(!outbox().length&&S.online)toast('Toutes les notes sont envoyées.');
}

function ouvrir(kind,id){
  if(estVerrou(S.classe,S.trim)){toast('Ce trimestre est verrouillé.');return}
  if(!elevesOf(S.classe).length){
    if(isBureau()){S.tab='eleves';S.elClasse=S.classe;S.view=null;render(true);window.scrollTo(0,0);toast('Aucun élève en '+S.classe+' : ajoutez d\'abord la liste des élèves, puis créez le devoir.')}
    else toast('Aucun élève en '+S.classe+' : le secrétariat doit d\'abord saisir la liste de la classe.');
    return}
  const evs=vueEvals();let ev;
  if(kind==='compo')ev=evs.find(e=>e.classe===S.classe&&e.matiere===S.matiere&&e.trimestre===S.trim&&e.type==='compo');
  else ev=id?evs.find(e=>e.id===id):null;
  const neuf=!ev;
  if(neuf){const n=evs.filter(e=>e.classe===S.classe&&e.trimestre===S.trim&&e.type==='devoir').length;
    ev={id:uuid(),annee:S.annee,classe:S.classe,matiere:S.matiere,trimestre:S.trim,type:kind,titre:kind==='compo'?'Composition':'Devoir '+(n+1),date:today()}}
  const notes=vueNotes(ev.id)||{},vals={};
  elevesOf(ev.classe).forEach(e=>{const x=notes[e.id]||{};vals[e.id]={note:num(x.note)?fmtN(x.note):'',nc:num(x.note_classe)?fmtN(x.note_classe):'',disp:!!x.dispense}});
  S.draft={ev:{...ev},neuf,vals};S.view='edit';S.confirm=null;S.err='';render(true);window.scrollTo(0,0);
}

function moyTxt(a,b){if(Number.isNaN(a)||Number.isNaN(b))return '–';let m=null;if(a!=null&&b!=null)m=(a+b)/3;else if(b!=null)m=b/2;else if(a!=null)m=a;return m==null?'–':'<span class="'+cls(m)+'">'+fmt(m)+'</span>'}
function enregistrer(){
  const D=S.draft,ev=D.ev,compo=ev.type==='compo',els=elevesOf(ev.classe),bad=[],notes={},cleared=[];
  if(estVerrou(ev.classe,ev.trimestre)){S.err='Ce trimestre est verrouillé.';render(true);return}
  els.forEach(e=>{const v=D.vals[e.id];
    if(compo&&v.disp){notes[e.id]={note:null,note_classe:null,dispense:true};return}
    const n=parseNote(v.note,compo?40:20),c=compo?parseNote(v.nc,20):null;
    if(Number.isNaN(n)||Number.isNaN(c)){bad.push(nomEleve(e));return}
    if(n==null&&c==null)cleared.push(e.id);else notes[e.id]={note:n,note_classe:c,dispense:false}});
  if(bad.length){S.err=(compo?'Note invalide (classe 0 à 20, composition 0 à 40) pour : ':'Note invalide (0 à 20) pour : ')+bad.join(', ');render(true);return}
  if(!compo){ev.titre=(ev.titre||'').trim()||'Devoir';if(!Object.keys(notes).length&&D.neuf){S.err='Saisissez au moins une note.';render(true);return}}
  const serveur=S.notes[ev.id]||{};
  const p={pid:uuid(),kind:'save',ev:{id:ev.id,annee:ev.annee,classe:ev.classe,matiere:ev.matiere,trimestre:ev.trimestre,type:ev.type,titre:ev.titre,date:ev.date||null},notes,cleared:cleared.filter(id=>id in serveur),at:Date.now()};
  mettreEnFile(p);if(!compo&&ev.classe===S.classe){S.matiere=ev.matiere;saveSel()}S.view=null;S.draft=null;S.err='';render(true);
  if(S.online&&navigator.onLine){toast(isBureau()&&!compo?'Notes enregistrées. Touchez « Parents » pour prévenir les parents.':'Notes enregistrées. Envoi…');synchroniser()}
  else toast('Notes gardées sur le téléphone. Elles partiront au retour du réseau.');
}
function supprimer(){
  const ev=S.draft.ev;mettreEnFile({pid:uuid(),kind:'del',ev:{...ev},notes:{},cleared:[],at:Date.now()});
  S.view=null;S.draft=null;S.confirm=null;render(true);toast('Devoir supprimé.');if(S.online)synchroniser();
}

function majEleve(r){const i=S.eleves.findIndex(e=>e.id===r.id);if(i>=0)S.eleves[i]=r;else S.eleves.push(r)}

/* ----- Certificat de fréquentation scolaire (directeur et secrétariat) -----
   Les noms du père et de la mère ne sont pas sur la fiche de l'élève : on les saisit au moment d'imprimer,
   ils ne sont pas enregistrés. Le numéro proposé suit le dernier numéro imprimé sur ce téléphone. */
const CERT_ACADEMIE='Kalabancoro',CERT_CAP='Ouezzindougou',CERT_LIEU='Katibougou';
const MOIS_CERT=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const dateCert=d=>d&&/^\d{4}-\d{2}-\d{2}/.test(d)?(+d.slice(8,10)===1?'1er':String(+d.slice(8,10)))+' '+MOIS_CERT[+d.slice(5,7)-1]+' '+d.slice(0,4):'';
const aujourdhui=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
async function ouvrirCert(id){
  let e=S.eleves.find(x=>x.id===id);if(!e){toast('Cet élève n\'existe plus.');return}
  e={...e};
  if(S.online){try{const r=chk(await sb.from('eleves').select('id,matricule,nom,prenom,sexe,classe,naissance_date,naissance_lieu,parent_nom').eq('id',id).maybeSingle());if(r)e={...e,...r}}catch(_){}}
  const an=String(S.annee),dern=lsGet('bn-cert-num');
  const num=dern&&dern.annee===an&&Number(dern.n)>=0?String(Number(dern.n)+1).padStart(4,'0'):'';
  S.cert={e,numero:num,naissance_date:e.naissance_date||'',naissance_lieu:e.naissance_lieu||'',pere:'',mere:'',date:aujourdhui(),err:'',retour:S.view};
  S.view='cert';render(true);window.scrollTo(0,0);
}

function imprimerCert(){
  const C=S.cert;if(!C)return;
  C.pere=String(C.pere).trim().replace(/\s+/g,' ');C.mere=String(C.mere).trim().replace(/\s+/g,' ');
  if(!C.pere&&!C.mere){C.err='Indiquez au moins le nom du père ou celui de la mère.';render(true);const i=document.getElementById('c-pere');if(i)i.focus();return}
  C.err='';render(true);
  const n=parseInt(String(C.numero).replace(/\D/g,''),10);if(n>=0)lsSet('bn-cert-num',{annee:String(S.annee),n});
  document.getElementById('print').innerHTML='<div class="feuille un">'+docCertificat(C)+'</div>';
  document.getElementById('pagefmt').textContent='@page{size:A4 portrait;margin:12mm}';
  setTimeout(()=>window.print(),60);
}
async function enregistrerEleve(force){
  const e=S.elDraft,nom=String(e.nom).trim().replace(/\s+/g,' '),prenom=String(e.prenom).trim().replace(/\s+/g,' ');
  if(!nom||!prenom){S.err='Le nom et le prénom sont obligatoires.';render(true);return}
  if(e.sexe!=='F'&&e.sexe!=='M'){S.err='Indiquez si c\'est une fille ou un garçon : le matricule en dépend.';render(true);return}
  if(!force){const k=cleNom(nom,prenom),d=S.eleves.find(x=>x.id!==e.id&&x.classe===e.classe&&cleNom(x.nom,x.prenom)===k);
    if(d&&!confirm(nomEleve(d)+' est déjà inscrit(e) en '+e.classe+'. Enregistrer quand même un second élève de ce nom ?'))return}
  const v=t=>{t=String(t??'').trim();return t||null};
  const row={nom:nom.toUpperCase(),prenom,sexe:e.sexe,classe:e.classe,naissance_date:v(e.naissance_date),naissance_lieu:v(e.naissance_lieu),parent_nom:v(e.parent_nom),parent_tel:v(e.parent_tel)};
  S.busy=true;S.err='';render(true);
  try{const r=e.id?chk(await sb.from('eleves').update(row).eq('id',e.id).select(champsEl()).single()):chk(await sb.from('eleves').insert(row).select(champsEl()).single());
    majEleve(r);saveCache();S.busy=false;S.elClasse=r.classe;
    if(e.id){S.view=S.vueAvant||null;S.elDraft=null;render(true);toast('Élève enregistré.')}
    else{S.elDraft={nom:'',prenom:'',sexe:'',classe:r.classe,matricule:'',naissance_date:'',naissance_lieu:'',parent_nom:'',parent_tel:''};render(true);toast(nomEleve(r)+' ajouté(e)'+(r.matricule?', matricule '+r.matricule:'')+'. Vous pouvez saisir le suivant.');const n=document.getElementById('e-nom');if(n)n.focus()}
  }catch(err){S.busy=false;S.err=estReseau(err)?'Pas de réseau : réessayez quand la connexion revient.':(err.code==='23505'?'Ce matricule est déjà utilisé par un autre élève.':msgErreur(err));render(true)}
}
async function supprimerEleve(){
  const id=S.elDraft.id;S.busy=true;render(true);
  try{chk(await sb.from('eleves').delete().eq('id',id));S.eleves=S.eleves.filter(x=>x.id!==id);Object.values(S.notes).forEach(n=>{if(n)delete n[id]});saveCache();
    S.busy=false;S.view=null;S.elDraft=null;S.confirm=null;render(true);toast('Élève supprimé.')}
  catch(err){S.busy=false;S.confirm=null;S.err=estReseau(err)?'Pas de réseau.':msgErreur(err);render(true)}
}
/* Liste collée : une ligne par élève — « NOM Prénom », éventuellement « F » ou « G » à la fin */
function lireListe(txt){
  return String(txt||'').split(/\r?\n/).map(l=>l.replace(/ /g,' ').trim()).filter(Boolean).map(brut=>{
    let l=brut.replace(/^\d+\s*[.)\-–]?\s+/,'').trim(),sexe=null;
    const m=l.match(/(?:^|[\s;,\t])(F|M|G|fille|garçon|garcon)\s*$/i);
    if(m&&l.length>m[0].length){const s=m[1].toLowerCase();sexe=(s==='f'||s==='fille')?'F':'M';l=l.slice(0,l.length-m[0].length).trim()}
    l=l.replace(/[;,\t]+$/,'').trim();
    let nom='',prenom='';
    const parts=l.split(/\s*[;\t]\s*/).filter(Boolean);
    if(parts.length>=2){nom=parts[0];prenom=parts.slice(1).join(' ')}
    else{const w=l.split(/\s+/),maj=s=>s===s.toUpperCase()&&s!==s.toLowerCase();let k=0;while(k<w.length-1&&maj(w[k]))k++;if(k===0||w.every(maj))k=1;nom=w.slice(0,k).join(' ');prenom=w.slice(k).join(' ')}
    return {brut,nom:nom.toUpperCase(),prenom,sexe,ok:!!(nom&&prenom)};
  });
}

    h+='<p class="small muted">Vérifiez que le nom et le prénom sont bien séparés. Sinon, corrigez la liste et vérifiez à nouveau.</p>';
    if(bons.length)h+='<div class="tw"><table><thead><tr><th class="n">N°</th><th>Nom</th><th>Prénom(s)</th><th>Sexe</th></tr></thead><tbody>'+bons.map((r,i)=>'<tr><td class="n">'+(i+1)+'</td><td><b>'+esc(r.nom)+'</b></td><td>'+esc(r.prenom)+'</td><td>'+(r.sexe==='F'?'F':'G')+'</td></tr>').join('')+'</tbody></table></div>';
    h+=(S.err?'<p class="err">'+esc(S.err)+'</p>':'')+'<div class="row"><button class="btn primary" data-act="imp-save"'+(bons.length&&!S.busy?'':' disabled')+'>'+(S.busy?'Enregistrement…':'Enregistrer ces '+bons.length+' élèves')+'</button></div></div>';
  }
  return h;
}
function verifierImport(){
  const I=S.imp,vus=new Set(elevesOf(I.classe).map(e=>cleNom(e.nom,e.prenom)));
  I.lignes=lireListe(I.texte).map(r=>{const k=cleNom(r.nom,r.prenom);r.doublon=r.ok&&vus.has(k);if(r.ok)vus.add(k);return r});
  S.err=I.lignes.length?'':'La liste est vide.';render(true);
}
async function enregistrerImport(){
  const I=S.imp,rows=(I.lignes||[]).filter(r=>r.ok&&!r.doublon&&r.sexe).map(r=>({nom:r.nom,prenom:r.prenom,sexe:r.sexe,classe:I.classe}));
  if(!rows.length)return;S.busy=true;S.err='';render(true);let n=0;
  try{for(let i=0;i<rows.length;i+=100){const d=chk(await sb.from('eleves').insert(rows.slice(i,i+100)).select(champsEl()));d.forEach(majEleve);n+=d.length}
    saveCache();S.busy=false;S.elClasse=I.classe;S.imp=null;S.view=null;render(true);toast(n+' élève'+(n>1?'s':'')+' ajouté'+(n>1?'s':'')+' en '+I.classe+'.')}
  catch(err){S.busy=false;saveCache();S.err=(n?n+' élèves ont été ajoutés, mais la suite a échoué : ':'')+(estReseau(err)?'pas de réseau.':msgErreur(err));if(n){I.lignes=null}render(true)}
}

/* ----- Bulletins (directeur et secrétariat) -----
   Calculés directement à partir des notes saisies :
   - notes de classe /20 : celles saisies avec la composition ; à défaut, la moyenne des devoirs de la matière ;
   - composition : note /40 ramenée sur 20 ;
   - moyenne de la matière = (notes de classe + 2 × composition sur 20) ÷ 3 ;
   - une matière dont il manque l'une des deux notes donne une moyenne provisoire (*) ;
   - un élève dispensé : la matière ne compte ni dans ses points ni dans son total de coefficients. */
const niv=c=>String(c||'')[0];
const matsFor=c=>S.matieres.filter(m=>(m.niveaux||[]).includes(niv(c)));
function coefFor(m,n){const c=m.coefs&&Number(m.coefs[n]);return c>0?c:1}
function appr(v){if(!num(v))return '';const T=[[2,'Nul'],[4,'Mal'],[6,'Médiocre'],[8,'Faible'],[10,'Insuffisant'],[12,'Passable'],[14,'Assez-Bien'],[16,'Bien'],[18,'Très-Bien']];for(const[m,l]of T)if(v<m)return l;return 'Excellent'}
const fmt3=v=>num(v)?v.toFixed(3).replace('.',','):'–';
const classeLong=c=>c[0]+'ème Année';
const repart=c=>c.slice(-1);
const trimCap=t=>t===1?'1er Trimestre':t+'e Trimestre';
function rangTxt(r,ex,sexe){if(!r)return '–';const s=r===1?(sexe==='F'?'1re':'1er'):r+'e';return ex?s+' ex æquo':s}
function indexClasse(c,t){
  const by={};
  vueEvals().filter(e=>e.classe===c&&e.trimestre===t&&(e.annee||S.annee)===S.annee).forEach(e=>{
    const b=by[e.matiere]||(by[e.matiere]={compo:null,devs:[]});if(e.type==='compo')b.compo=e;else b.devs.push(e)});
  return by;
}
function ligneMat(eid,m,b,coef){
  const L={m,coef,mc:null,c:null,moy:null,pts:null,incomplet:false,disp:false,dev:false};
  if(!b)return L;
  if(b.compo){const n=(vueNotes(b.compo.id)||{})[eid];
    if(n&&n.dispense){L.disp=true;return L}
    if(n&&num(n.note_classe))L.mc=n.note_classe;
    if(n&&num(n.note))L.c=n.note/2}
  if(L.mc==null){const vs=b.devs.map(d=>((vueNotes(d.id)||{})[eid]||{}).note).filter(num);if(vs.length){L.mc=avg(vs);L.dev=true}}
  L.moy=L.mc!=null&&L.c!=null?(L.mc+2*L.c)/3:(L.c!=null?L.c:L.mc);
  if(L.moy!=null){L.pts=L.moy*coef;L.incomplet=L.mc==null||L.c==null}
  return L;
}
function bulletinData(e,t,mats,by){
  const lines=mats.map(m=>ligneMat(e.id,m,by[m.id],coefFor(m,niv(e.classe))));
  const ok=lines.filter(l=>!l.disp&&l.moy!=null),sc=ok.reduce((s,l)=>s+l.coef,0),tot=ok.reduce((s,l)=>s+l.pts,0);
  return {lines,sumCoef:sc,total:tot,moyGen:sc?tot/sc:null,nbMat:ok.length};
}
function rankList(items,get){const vals=items.map(get),sorted=vals.filter(num).map(v=>Math.round(v*1000)).sort((a,b)=>b-a);
  items.forEach((it,i)=>{const v=vals[i];if(!num(v)){it.rang=null;it.ex=false;return}const r=Math.round(v*1000);it.rang=sorted.indexOf(r)+1;it.ex=sorted.filter(x=>x===r).length>1})}
function classResults(c,t){const mats=matsFor(c),by=indexClasse(c,t);const res=elevesOf(c).map(e=>({e,b:bulletinData(e,t,mats,by)}));rankList(res,r=>r.b.moyGen);return res}
function annualResults(c){const mats=matsFor(c),bys=[1,2,3].map(t=>indexClasse(c,t));
  const res=elevesOf(c).map(e=>{const ts=[1,2,3].map(t=>bulletinData(e,t,mats,bys[t-1]).moyGen);return {e,ts,moyAn:ts.every(num)?avg(ts):null}});rankList(res,r=>r.moyAn);return res}
const decision=v=>num(v)?(v>=10?'Admis(e) en classe supérieure':'Redouble'):'';
/* Matières où des notes manquent encore (pour le contrôle avant impression) */
function controle(c,t){
  const els=elevesOf(c),by=indexClasse(c,t);
  return matsFor(c).map(m=>{const ls=els.map(e=>ligneMat(e.id,m,by[m.id],1));
    const manque=ls.filter(l=>!l.disp&&(l.moy==null||l.incomplet)).length;return {m,manque,total:els.length}}).filter(x=>x.manque);
}
async function chargerBulletins(){
  if(!isBureau()||!sb)return;
  const c=S.bulClasse,ids=S.evals.filter(e=>e.classe===c&&!S.notes[e.id]).map(e=>e.id);
  if(!ids.length){S.bulCharge[c]=true;return}
  try{await chargerNotes(ids);S.bulCharge[c]=true;saveCache()}catch(e){if(estReseau(e))S.online=false}
  if(S.tab==='bulletins')render();
}
function viewBulletins(){
  const c=CLASSES.includes(S.bulClasse)?S.bulClasse:(S.classe||CLASSES[0]);S.bulClasse=c;
  const res=classResults(c,S.trim),eff=res.length;
  let h='<div class="card"><h2>Bulletins</h2><div class="chips" role="group" aria-label="Classe">'+CLASSES.map(k=>'<button class="chip" data-act="bulcl" data-c="'+k+'" aria-pressed="'+(k===c)+'">'+k+'</button>').join('')+'</div>'+trimChips()+
    '<p class="small muted">Les bulletins se remplissent tout seuls avec les notes saisies par les enseignants (notes de classe, compositions et devoirs).</p><div class="row"><button class="btn" data-act="stats-open">Palmarès et statistiques</button></div></div>';
  if(!eff)return h+'<div class="notice warn"><b>Aucun élève en '+esc(c)+'</b><p class="small">Ajoutez d\'abord les élèves de la classe.</p><div><button class="btn sm" data-act="go-eleves" data-c="'+esc(c)+'">Ajouter les élèves de '+esc(c)+'</button></div></div>';
  if(!S.bulCharge[c]&&S.online)h+='<p class="small muted">Chargement des notes de la classe…</p>';
  const ctl=controle(c,S.trim);
  if(ctl.length)h+='<div class="notice warn"><b>Notes encore manquantes · '+trimName(S.trim)+'</b><p class="small">Les bulletins de ces matières auront des moyennes provisoires (*) ou vides :</p><div class="small">'+ctl.map(x=>esc(x.m.nom)+' : '+x.manque+'/'+x.total+' élève'+(x.manque>1?'s':'')).join(' · ')+'</div></div>';
  else h+='<div class="notice"><b>Toutes les notes du '+trimName(S.trim)+' sont saisies en '+esc(c)+'.</b></div>';
  const vals=res.map(r=>r.b.moyGen).filter(num),admis=vals.filter(v=>v>=10).length;
  h+='<div class="tw"><table><tbody><tr><th>Effectif</th><td class="n"><b>'+eff+'</b></td><th>Moyenne de la classe</th><td class="n"><b>'+fmt(avg(vals))+'</b></td></tr><tr><th>Moyenne ≥ 10</th><td class="n"><b>'+admis+'/'+vals.length+'</b></td><th>Plus forte</th><td class="n"><b>'+fmt(vals.length?Math.max(...vals):null)+'</b></td></tr></tbody></table></div>';
  h+='<div class="row"><button class="btn primary" data-act="print" data-n="2">Imprimer : 2 bulletins par feuille</button><button class="btn" data-act="print" data-n="1">1 par feuille</button></div>';
  const sorted=[...res].sort((a,b)=>(a.rang||9999)-(b.rang||9999)||String(a.e.nom).localeCompare(b.e.nom,'fr'));
  h+='<div class="list">'+sorted.map(r=>'<div class="li"><span class="no">'+(r.rang||'–')+'</span><span><b>'+esc(nomEleve(r.e))+'</b><br><span class="small muted">'+(r.b.nbMat?r.b.nbMat+' matière'+(r.b.nbMat>1?'s':'')+' notée'+(r.b.nbMat>1?'s':''):'Aucune note')+' · <span class="'+cls(r.b.moyGen)+'">'+fmt(r.b.moyGen)+'</span></span></span><button class="btn sm" data-act="bul" data-id="'+r.e.id+'">Voir</button></div>').join('')+'</div>';
  return h;
}
function docBulletin(r,eff,premier,an){
  const e=r.e,c3=v=>num(v)?fmt3(v):'',f2=v=>num(v)?fmt(v):'',dsp='Dispensé'+(e.sexe==='F'?'e':'');
  let h='<div class="doc"><div class="dhead">'+(S.logo?'<img src="'+esc(S.logo)+'" alt="">':'<span></span>')+'<div><h3>'+esc(S.ecole.toUpperCase())+'</h3><p>Second Cycle</p><p class="it">Bulletin de Notes du '+trimCap(S.trim)+'</p><p class="it sm">Année scolaire : '+esc(S.annee.replace(/\s*-\s*/,' - '))+'</p></div><span></span></div>';
  h+='<table><thead><tr><th>Id Élève</th><th>Nom</th><th>Prénom</th><th>Classe</th><th>Répartition</th></tr></thead><tbody><tr><td class="c">'+esc(e.matricule||'')+'</td><td class="c"><b>'+esc((e.nom||'').toUpperCase())+'</b></td><td class="c">'+esc(e.prenom||'')+'</td><td class="c">'+classeLong(e.classe)+'</td><td class="c">'+repart(e.classe)+'</td></tr></tbody></table>';
  h+='<table><thead><tr><th class="l">Matières</th><th>Notes de<br>Classe</th><th>Notes de<br>Comp.</th><th>Moy.<br>Notes</th><th>Coef.</th><th>Moy.<br>Coef.</th><th>Observation Maîtres</th></tr></thead><tbody>';
  r.b.lines.forEach(l=>{
    if(l.disp){h+='<tr><td>'+esc(l.m.nom)+'</td><td class="c" colspan="3"><i>'+dsp+'</i></td><td class="c">–</td><td class="c"></td><td class="c">'+dsp+'</td></tr>';return}
    h+='<tr><td>'+esc(l.m.nom)+'</td><td class="c">'+f2(l.mc)+'</td><td class="c">'+(l.c!=null?f2(l.c*2):'')+'</td><td class="c">'+(l.moy!=null?c3(l.moy)+(l.incomplet?'*':''):'')+'</td><td class="c">'+fmtN(l.coef)+'</td><td class="c">'+c3(l.pts)+'</td><td class="c">'+appr(l.moy)+'</td></tr>'});
  h+='</tbody></table>';
  if(an)h+='<table><thead><tr><th>Moy. 1er Trim.</th><th>Moy. 2e Trim.</th><th>Moy. 3e Trim.</th><th>Moy. Annuelle</th><th>Rang Annuel</th><th>Décision</th></tr></thead><tbody><tr><td class="c">'+c3(an.ts[0])+'</td><td class="c">'+c3(an.ts[1])+'</td><td class="c">'+c3(an.ts[2])+'</td><td class="c"><b>'+c3(an.moyAn)+'</b></td><td class="c">'+rangTxt(an.rang,an.ex,e.sexe)+'</td><td class="c"><b>'+(decision(an.moyAn)||'En attente des 3 trimestres')+'</b></td></tr></tbody></table>';
  h+='<div class="dfoot"><div class="dcol"><table><tbody><tr><td class="lb">Total Coef.</td><td class="c">'+fmtN(r.b.sumCoef)+'</td></tr><tr><td class="lb">Total Moy. Coef.</td><td class="c">'+c3(r.b.total)+'</td></tr><tr><td class="lb">Moyenne gén.</td><td class="c"><b>'+c3(r.b.moyGen)+'</b></td></tr><tr><td class="lb">Rang</td><td class="c"><b>'+rangTxt(r.rang,r.ex,e.sexe)+'</b></td></tr></tbody></table>'+
    '<table><thead><tr><th colspan="2">Le Tuteur</th></tr></thead><tbody><tr><td class="lb">Nom et Prénoms</td><td class="c"></td></tr><tr><td class="lb sigcell">Signature</td><td class="sigcell"></td></tr></tbody></table></div>'+
    '<div class="dcol"><table><tbody><tr><td class="lb">Nbr. Élèves dans la classe</td><td class="c">'+eff+' Élèves</td></tr><tr><td class="lb">Moyenne du Premier</td><td class="c">'+c3(premier)+'</td></tr></tbody></table>'+
    '<table><thead><tr><th colspan="2">Le Directeur</th></tr></thead><tbody><tr><td class="lb">Nom et Prénoms</td><td class="c">'+esc(S.directeur||'')+'</td></tr><tr><td class="lb">Observation</td><td class="c"><b>'+appr(r.b.moyGen)+'</b></td></tr><tr><td colspan="2" class="cachet">Cachet et signature</td></tr></tbody></table></div></div>';
  if(r.b.lines.some(l=>l.incomplet))h+='<p class="sm it">* moyenne provisoire : il manque les notes de classe ou la composition dans cette matière.</p>';
  return h+'</div>';
}
function contexteBul(c){
  const res=classResults(c,S.trim),vals=res.map(r=>r.b.moyGen).filter(num);
  const an=S.trim===3?annualResults(c):null;
  return {res,eff:res.length,premier:vals.length?Math.max(...vals):null,an:id=>an?an.find(x=>x.e.id===id):null};
}
function viewBulletin(){
  const K=contexteBul(S.bulClasse),i=K.res.findIndex(r=>r.e.id===S.bulId);
  if(i<0){S.view=null;return viewBulletins()}
  const sorted=[...K.res].sort((a,b)=>String(a.e.nom).localeCompare(b.e.nom,'fr')||String(a.e.prenom).localeCompare(b.e.prenom,'fr'));
  const j=sorted.findIndex(r=>r.e.id===S.bulId),prev=sorted[j-1],next=sorted[j+1],r=K.res[i];
  let h='<div class="row between"><button class="btn ghost" data-act="bul-close">← Liste de la classe</button><div class="row">'+(prev?'<button class="btn sm" data-act="bul" data-id="'+prev.e.id+'">‹ Précédent</button>':'')+(next?'<button class="btn sm" data-act="bul" data-id="'+next.e.id+'">Suivant ›</button>':'')+'<button class="btn sm primary" data-act="print-one">Imprimer</button></div></div>';
  return h+'<div class="doc-wrap">'+docBulletin(r,K.eff,K.premier,K.an(r.e.id))+'</div>';
}
function imprimer(mode,seul){
  const K=contexteBul(S.bulClasse),eff=K.eff;
  let liste=[...K.res].sort((a,b)=>String(a.e.nom).localeCompare(b.e.nom,'fr')||String(a.e.prenom).localeCompare(b.e.prenom,'fr'));
  if(seul)liste=liste.filter(r=>r.e.id===seul);
  if(!liste.length)return;
  const docs=liste.map(r=>docBulletin(r,eff,K.premier,K.an(r.e.id)));
  let h='';
  if(mode===2)for(let i=0;i<docs.length;i+=2)h+='<div class="feuille deux">'+docs[i]+(docs[i+1]||'<div class="doc vide"></div>')+'</div>';
  else h=docs.map(d=>'<div class="feuille un">'+d+'</div>').join('');
  document.getElementById('print').innerHTML=h;
  document.getElementById('pagefmt').textContent='@page{size:A4 '+(mode===2?'landscape':'portrait')+';margin:8mm}';
  setTimeout(()=>window.print(),60);
}

/* ----- Palmarès et statistiques (directeur et secrétariat) -----
   Période : 1er, 2e, 3e trimestre ou année (moyenne annuelle = moyenne des trois trimestres).
   - A composé : l'élève a au moins une note de composition dans le trimestre (pour l'année : ses trois moyennes existent).
   - A la moyenne : moyenne générale ≥ 10/20, parmi ceux qui ont composé.
   - Taux de réussite = ont la moyenne ÷ ont composé ; taux d'échec = le reste.
   - Palmarès : les trois premiers de chaque classe, puis les trois premiers de toute l'école (ex æquo compris). */
async function chargerToutesNotes(tout){
  if(!isBureau()||!sb)return;
  const ids=S.evals.filter(e=>tout||!S.notes[e.id]).map(e=>e.id);
  S.statsBusy=true;if(S.tab==='bulletins'&&S.view==='stats')render();
  try{if(ids.length){await chargerNotes(ids);saveCache()}CLASSES.forEach(c=>S.bulCharge[c]=true);S.statsAt=Date.now()}
  catch(e){if(estReseau(e))S.online=false}
  S.statsBusy=false;if(S.tab==='bulletins'&&S.view==='stats')render();
}
const periodeNom=p=>p==='an'?'Année '+S.annee:trimName(p);
function aCompose(e,by){return Object.values(by).some(b=>{if(!b.compo)return false;const n=(vueNotes(b.compo.id)||{})[e.id];return !!n&&!n.dispense&&num(n.note)})}
function resultatsPeriode(c,p){
  if(p==='an')return annualResults(c).map(r=>({e:r.e,moy:r.moyAn,rang:r.rang,ex:r.ex,comp:num(r.moyAn)}));
  const by=indexClasse(c,p);
  return classResults(c,p).map(r=>({e:r.e,moy:r.b.moyGen,rang:r.rang,ex:r.ex,comp:aCompose(r.e,by)}));
}
function compter(list){
  const z=f=>{const L=list.filter(f),comp=L.filter(r=>r.comp),moy=comp.filter(r=>num(r.moy)&&r.moy>=10).length;
    return {eff:L.length,comp:comp.length,moy,reu:comp.length?moy/comp.length*100:null,ech:comp.length?(comp.length-moy)/comp.length*100:null}};
  return {G:z(r=>r.e.sexe==='M'),F:z(r=>r.e.sexe==='F'),T:z(()=>true)};
}
const pct=v=>num(v)?(Math.round(v*10)/10).toFixed(1).replace('.',',')+' %':'–';
const LIGNES_STAT=[['eff','Effectif',String],['comp','Ont composé',String],['moy','Ont la moyenne (≥ 10)',String],['reu','Taux de réussite',pct],['ech','Taux d\'échec',pct]];
function donneesStats(p){
  const parClasse=CLASSES.map(c=>{const res=resultatsPeriode(c,p);
    const manque=p==='an'?[1,2,3].some(t=>controle(c,t).length):controle(c,p).length>0;
    return {c,res,st:compter(res),podium:res.filter(r=>r.rang&&r.rang<=3).sort((a,b)=>a.rang-b.rang||String(a.e.nom).localeCompare(b.e.nom,'fr')),manque}});
  const tous=parClasse.flatMap(x=>x.res).map(r=>({...r}));
  rankList(tous,r=>r.moy);
  const podium=tous.filter(r=>r.rang&&r.rang<=3).sort((a,b)=>a.rang-b.rang||String(a.e.nom).localeCompare(b.e.nom,'fr'));
  return {parClasse,podium,st:compter(tous),provisoire:parClasse.filter(x=>x.manque&&x.res.length).map(x=>x.c)};
}
function tableStat(st){
  return '<div class="tw"><table class="stat"><thead><tr><th></th><th class="n">Garçons</th><th class="n">Filles</th><th class="n">Total</th></tr></thead><tbody>'+
    LIGNES_STAT.map(([k,l,f])=>'<tr><th scope="row">'+l+'</th><td class="n">'+f(st.G[k])+'</td><td class="n">'+f(st.F[k])+'</td><td class="n"><b>'+f(st.T[k])+'</b></td></tr>').join('')+'</tbody></table></div>';
}
function lignePodium(r,avecClasse){
  return '<li><span class="pod-r">'+rangTxt(r.rang,r.ex,r.e.sexe)+'</span><span class="pod-n"><b>'+esc(nomEleve(r.e))+'</b>'+(avecClasse?' <span class="small muted">'+esc(r.e.classe)+'</span>':'')+'</span><span class="pod-m '+cls(r.moy)+'">'+fmt3(r.moy)+'</span></li>';
}
function viewStats(){
  const p=S.statsP||S.trim,D=donneesStats(p);
  let h='<button class="btn ghost" data-act="stats-close">← Bulletins</button><div class="card"><h2>Palmarès et statistiques</h2>'+
    '<div class="chips" role="group" aria-label="Période">'+[1,2,3,'an'].map(k=>'<button class="chip" data-act="stats-p" data-p="'+k+'" aria-pressed="'+(p===k)+'">'+(k==='an'?'Année':trimName(k))+'</button>').join('')+'</div>'+
    '<div class="row"><button class="btn primary" data-act="stats-print">Imprimer</button><button class="btn" data-act="stats-maj"'+(S.statsBusy?' disabled':'')+'>'+(S.statsBusy?'Chargement des notes…':'Actualiser les notes')+'</button></div>'+
    (S.statsAt?'<p class="small muted">Notes à jour à '+heure(S.statsAt)+'.</p>':'')+'</div>';
  if(!S.eleves.length)return h+'<div class="notice warn"><b>Aucun élève inscrit.</b><p class="small">Ajoutez d\'abord les élèves dans l\'onglet Élèves.</p></div>';
  if(D.provisoire.length)h+='<div class="notice warn"><b>Résultats provisoires</b><p class="small">Des notes manquent encore en '+D.provisoire.map(esc).join(', ')+'. Les moyennes et les rangs changeront quand tout sera saisi.</p></div>';
  h+='<div class="card"><h2>Les 3 premiers de l\'école · '+esc(periodeNom(p))+'</h2>'+(D.podium.length?'<ol class="pod">'+D.podium.map(r=>lignePodium(r,true)).join('')+'</ol>':'<p class="small muted">Pas encore de moyennes pour cette période.</p>')+'</div>';
  h+='<div class="card"><h2>Toute l\'école</h2>'+tableStat(D.st)+'</div>';
  D.parClasse.forEach(x=>{
    h+='<div class="card"><h2>'+esc(x.c)+'</h2>';
    if(!x.res.length){h+='<p class="small muted">Aucun élève inscrit.</p></div>';return}
    h+=(x.podium.length?'<ol class="pod">'+x.podium.map(r=>lignePodium(r,false)).join('')+'</ol>':'<p class="small muted">Pas encore de moyennes.</p>')+tableStat(x.st)+'</div>'});
  return h;
}
function imprimerStats(){
  const p=S.statsP||S.trim,D=donneesStats(p),f3=v=>num(v)?fmt3(v):'';
  const cols=[['eff',String],['comp',String],['moy',String],['reu',pct],['ech',pct]];
  const ligne=(nom,st,gras)=>'<tr><td class="'+(gras?'lb':'')+'">'+nom+'</td>'+cols.map(([k,f])=>['G','F','T'].map(x=>'<td class="c">'+(gras||x==='T'?'<b>'+f(st[x][k])+'</b>':f(st[x][k]))+'</td>').join('')).join('')+'</tr>';
  let h='<div class="feuille un"><div class="doc"><div class="dhead">'+(S.logo?'<img src="'+esc(S.logo)+'" alt="">':'<span></span>')+'<div><h3>'+esc(S.ecole.toUpperCase())+'</h3><p>Second Cycle</p><p class="it">Palmarès et statistiques · '+esc(periodeNom(p))+'</p><p class="it sm">Année scolaire : '+esc(S.annee.replace(/\s*-\s*/,' - '))+'</p></div><span></span></div>';
  if(D.provisoire.length)h+='<p class="sm it">Résultats provisoires : des notes manquent encore en '+D.provisoire.map(esc).join(', ')+'.</p>';

/* ----- Messages aux parents (directeur et secrétariat) -----
   Rien ne part tout seul : chaque message est envoyé depuis le WhatsApp du téléphone utilisé.
   - Devoirs : image de la note + message (élève absent = pas de message ; la composition n'est jamais envoyée).
   - Résultats du trimestre : image avec la moyenne et le rang, et invitation à venir signer le bulletin.
   - Suivi : trois devoirs de suite sous 10/20, toutes matières (absences sautées).
   - Encouragements : trois bonnes notes de suite (16/20, 13/20 en Rédaction) ; moyenne en hausse de 2 points.
   Chaque envoi est noté dans la base pour savoir quels parents ont déjà été prévenus. */
S.msg={classe:null,envD:{},envB:{},suivis:{},charge:{},manque:false,err:'',evalId:null,busy:false,pret:null};
function telDigits(t){let d=String(t||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===8)d='223'+d;return d.length>=10?d:''}
const telAff=d=>'+'+String(d).replace(/^223(\d{2})(\d{2})(\d{2})(\d{2})$/,'223 $1 $2 $3 $4');
const waLink=(tel,msg)=>'https://wa.me/'+telDigits(tel)+(msg?'?text='+encodeURIComponent(msg):'');
const slug=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
const dateLong=d=>d&&/^\d{4}-\d{2}-\d{2}/.test(d)?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const signature=()=>S.directeur?'Le Directeur, '+S.directeur:'La Direction';
const enfantTxt=e=>(e.prenom||'')+' '+(e.nom||'').toUpperCase()+', '+classeLong(e.classe)+' '+repart(e.classe);
const bonjour=e=>'Bonjour'+(e.parent_nom?' '+e.parent_nom:'')+',\n'+S.ecole+'\n\n';
const ilElle=e=>e.sexe==='F'?'elle':'lui';
function msgDevoir(e,d,n){return bonjour(e)+'Votre enfant '+enfantTxt(e)+', a obtenu *'+fmtN(n)+'/20* au devoir de *'+matName(d.matiere)+'*'+(d.date?' du '+dateLong(d.date):'')+'.\nAppréciation : '+appr(n)+'\n\nMerci de prendre la copie avec l\'enfant pour la signer.\n\n'+signature()}
const notes3=(e,devs)=>devs.map(d=>matName(d.matiere)+' : '+fmtN(noteDe(d,e.id))+'/20').join(', ');
function msgSuivi(e,devs){return bonjour(e)+'Votre enfant '+enfantTxt(e)+', a obtenu trois notes de suite en dessous de 10/20 aux derniers devoirs ('+notes3(e,devs)+').\n'+(e.sexe==='F'?'Elle':'Il')+' a besoin de plus de suivi et d\'encadrement à la maison. Nous vous invitons à passer à l\'école pour en parler avec nous.\n\n'+signature()}
function msgEncour(e,devs){return bonjour(e)+'Nous avons le plaisir de vous informer que votre enfant '+enfantTxt(e)+', a obtenu trois bonnes notes de suite aux derniers devoirs ('+notes3(e,devs)+').\nFélicitations à '+ilElle(e)+' ! Continuez à l\'encourager à la maison.\n\n'+signature()}
function msgProg(e,t,avant,apres){return bonjour(e)+'Votre enfant '+enfantTxt(e)+', a bien progressé : sa moyenne est passée de '+fmt(avant)+' au '+trimName(t-1)+' à '+fmt(apres)+' au '+trimName(t)+'.\nFélicitations à '+ilElle(e)+' pour ses efforts ! Continuez à l\'encourager à la maison.\n\n'+signature()}
function msgResultats(e,t,r,eff){return bonjour(e)+'Voici les résultats du '+trimName(t)+' ('+S.annee+') de '+enfantTxt(e)+'.\n\nMoyenne : *'+fmt3(r.b.moyGen)+'/20*\nRang : *'+rangTxt(r.rang,r.ex,e.sexe)+'* sur '+eff+' élèves\n\nLe bulletin complet est à l\'école. Merci de passer pour le signer.\n\n'+signature()}

/* Notes de devoir, alertes de suivi, encouragements */
function devoirsAnnee(c){return vueEvals().filter(e=>e.type==='devoir'&&e.classe===c&&(e.annee||S.annee)===S.annee).sort((a,b)=>String(a.date||'').localeCompare(b.date||'')||String(a.cree_le||'').localeCompare(b.cree_le||''))}
function noteDe(d,eid){const x=(vueNotes(d.id)||{})[eid];return x&&num(x.note)?x.note:null}
const seuilBonne=mid=>slug(matName(mid)).toLowerCase().includes('redaction')?13:16;
function series(c,test,pref){
  const ds=devoirsAnnee(c),out=[];
  elevesOf(c).forEach(e=>{let s=[];ds.forEach(d=>{const v=noteDe(d,e.id);if(v==null)return;
    if(test(v,d)){s.push(d);if(s.length===3){out.push({e,devs:s,dernier:d,cle:pref+S.annee+'_'+e.id+'_'+d.id});s=[]}}else s=[]})});
  return out.sort((a,b)=>String(b.dernier.date||'').localeCompare(a.dernier.date||'')||String(b.dernier.cree_le||'').localeCompare(a.dernier.cree_le||''));
}
const alertesSuivi=c=>series(c,v=>v<10,'suivi_');
const encouragements=c=>series(c,(v,d)=>v>=seuilBonne(d.matiere),'enc_');
const bulComplet=b=>b.nbMat>0&&b.lines.every(l=>l.disp||(l.moy!=null&&!l.incomplet));
function progressions(c,t){
  if(t<2)return [];const mats=matsFor(c),a=indexClasse(c,t-1),b=indexClasse(c,t);
  return elevesOf(c).map(e=>{const x=bulletinData(e,t-1,mats,a),y=bulletinData(e,t,mats,b);
    if(!bulComplet(x)||!bulComplet(y))return null;
    return Math.round((y.moyGen-x.moyGen)*1000)>=2000?{type:'prog',e,t,avant:x.moyGen,apres:y.moyGen,devs:[],cle:'prog_'+S.annee+'_'+e.id+'_T'+t}:null}).filter(Boolean);
}

/* Chargement : notes de la classe et envois déjà faits */
const tableManque=e=>!!e&&(e.code==='PGRST205'||e.code==='42P01'||e.code==='42501'||/could not find the table|does not exist/i.test(String(e.message||'')));
async function parPaquets(ids,f){let out=[];for(let i=0;i<ids.length;i+=80)out=out.concat(await f(ids.slice(i,i+80)));return out}
async function chargerMessages(){
  if(!isBureau()||!sb)return;const M=S.msg,c=M.classe;if(!c)return;
  try{
    const ids=S.evals.filter(e=>e.classe===c&&!S.notes[e.id]).map(e=>e.id);
    if(ids.length){await chargerNotes(ids);saveCache()}
    const devIds=S.evals.filter(e=>e.classe===c&&e.type==='devoir').map(e=>e.id),elIds=elevesOf(c).map(e=>e.id);
    const [ed,eb,su]=await Promise.all([
      parPaquets(devIds,p=>fetchAll(()=>sb.from('envois_devoirs').select('evaluation_id,eleve_id,le').in('evaluation_id',p))),
      parPaquets(elIds,p=>fetchAll(()=>sb.from('envois_bulletins').select('trimestre,eleve_id,le').eq('annee',S.annee).in('eleve_id',p))),
      fetchAll(()=>sb.from('suivis').select('cle,le').eq('annee',S.annee))]);
    devIds.forEach(id=>M.envD[id]={});ed.forEach(r=>(M.envD[r.evaluation_id]||(M.envD[r.evaluation_id]={}))[r.eleve_id]=r.le);
    eb.forEach(r=>M.envB[r.trimestre+'_'+r.eleve_id]=r.le);su.forEach(r=>M.suivis[r.cle]=r.le);
    M.charge[c]=true;M.manque=false;M.err='';S.online=true;
  }catch(e){if(estReseau(e))S.online=false;else if(tableManque(e))M.manque=true;else M.err=msgErreur(e)}
  if(S.tab==='messages'&&S.view!=='eleve')render();
}
async function noterEnvoi(kind,eid,x){
  const M=S.msg,le=new Date().toISOString();let q;
  if(kind==='dev'){(M.envD[M.evalId]||(M.envD[M.evalId]={}))[eid]=le;q=()=>sb.from('envois_devoirs').upsert({evaluation_id:M.evalId,eleve_id:eid,le},{onConflict:'evaluation_id,eleve_id'})}
  else if(kind==='bul'){M.envB[S.trim+'_'+eid]=le;q=()=>sb.from('envois_bulletins').upsert({annee:S.annee,trimestre:S.trim,eleve_id:eid,le},{onConflict:'annee,trimestre,eleve_id'})}
  else{M.suivis[x.cle]=le;q=()=>sb.from('suivis').upsert({cle:x.cle,annee:S.annee,eleve_id:eid,devoirs:x.devs,le},{onConflict:'cle'})}
  setTimeout(()=>render(true),0); // après l'ouverture du lien WhatsApp
  try{chk(await q())}
  catch(e){if(tableManque(e)){M.manque=true;render(true)}else toast(estReseau(e)?'Pas de réseau : cet envoi n\'est noté que sur ce téléphone.':'Envoi non noté : '+msgErreur(e))}
}

/* Images envoyées aux parents */
function loadImg(src){return new Promise(ok=>{if(!src)return ok(null);const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=src})}
async function carteBase(sousTitre){
  try{await document.fonts.load('700 40px Bitter');await document.fonts.load('600 30px "Source Sans 3"')}catch(_){}
  const W=1080,H=1200,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d',{willReadFrequently:true}); // dessin sans la puce graphique : sur certains Android, elle retourne les textes
  x.fillStyle='#ffffff';x.fillRect(0,0,W,H);x.fillStyle='#13294b';x.fillRect(0,0,W,18);x.fillRect(0,H-18,W,18);
  const logo=await loadImg(S.logo);let y=56;
  if(logo){const k=Math.min(220/logo.width,220/logo.height),w=logo.width*k,h=logo.height*k;x.drawImage(logo,W/2-w/2,y+(220-h)/2,w,h);y+=240}else y+=140; // sans logo : contenu centré
  x.textAlign='center';
  const fit=(s,font,size,maxW)=>{let z=size;do{x.font=font.replace('%',z+'px');z-=2}while(x.measureText(s).width>maxW&&z>14)};
  x.fillStyle='#13294b';fit(S.ecole,'700 % Bitter, Georgia, serif',40,W-120);x.fillText(S.ecole,W/2,y+20);y+=60;
  x.font='italic 600 32px "Source Sans 3", Arial, sans-serif';x.fillStyle='#5a6678';x.fillText(sousTitre,W/2,y+10);y+=40;
  x.strokeStyle='#13294b';x.lineWidth=3;x.beginPath();x.moveTo(120,y);x.lineTo(W-120,y);x.stroke();y+=72;
  const cadre=(bx,by,bw,bh)=>{x.lineWidth=4;x.strokeStyle='#13294b';x.beginPath();if(x.roundRect)x.roundRect(bx,by,bw,bh,24);else x.rect(bx,by,bw,bh);x.stroke()};
  return {c,x,W,y,fit,cadre};
}
function nomEtClasse(K,e){const {x,W,fit}=K;x.fillStyle='#13294b';const nm=(e.prenom||'')+' '+(e.nom||'').toUpperCase();fit(nm,'700 % "Source Sans 3", Arial, sans-serif',56,W-140);x.fillText(nm,W/2,K.y);K.y+=54;
  x.font='600 34px "Source Sans 3", Arial, sans-serif';x.fillStyle='#5a6678';x.fillText(classeLong(e.classe)+' '+repart(e.classe)+(e.matricule?'  ·  '+e.matricule:''),W/2,K.y);K.y+=60}
function piedCarte(K,l1,l2){const {x,W}=K;x.fillStyle='#13294b';x.font='700 36px "Source Sans 3", Arial, sans-serif';x.fillText(l1,W/2,K.y);K.y+=48;if(l2){x.fillText(l2,W/2,K.y);K.y+=48}K.y+=16;
  x.font='italic 32px "Source Sans 3", Arial, sans-serif';x.fillStyle='#5a6678';x.fillText(signature(),W/2,K.y)}
async function carteNote(e,d,n){
  const K=await carteBase('Note de devoir');nomEtClasse(K,e);const {x,W}=K,bx=170,bw=W-340,bh=330,y=K.y;K.cadre(bx,y,bw,bh);
  x.fillStyle='#13294b';x.font='700 40px "Source Sans 3", Arial, sans-serif';x.fillText(matName(d.matiere)+(d.date?'  ·  '+dateLong(d.date):''),W/2,y+70);
  x.fillStyle=n<10?'#c2352a':'#1d7446';x.font='700 150px Bitter, Georgia, serif';x.fillText(fmtN(n)+'/20',W/2,y+225);

async function carteResultats(e,t,r,eff){
  const K=await carteBase('Résultats du '+trimName(t)+' · '+S.annee);nomEtClasse(K,e);const {x,W,fit}=K,gap=40,bw=(W-160-gap)/2,bh=300,y=K.y,m=r.b.moyGen;

/* Préparer un envoi : image + texte de l'élève */
function ctxRes(c,t){const res=classResults(c,t);return {res,eff:res.length}}
function preparer(kind,eid){
  const M=S.msg;
  if(kind==='dev'){const d=vueEvals().find(x=>x.id===M.evalId);if(!d)return null;const e=elevesOf(d.classe).find(x=>x.id===eid),n=e&&noteDe(d,eid);if(!e||n==null)return null;
    return {e,msg:msgDevoir(e,d,n),nom:'Note_'+slug(matName(d.matiere))+'_'+slug(nomEleve(e))+'.png',cle:'dev|'+d.id+'|'+eid+'|'+n,carte:()=>carteNote(e,d,n)}}
  const K=ctxRes(M.classe,S.trim),r=K.res.find(x=>x.e.id===eid);if(!r||!num(r.b.moyGen))return null;
  return {e:r.e,msg:msgResultats(r.e,S.trim,r,K.eff),nom:'Resultats_T'+S.trim+'_'+slug(nomEleve(r.e))+'.png',cle:'bul|'+S.trim+'|'+eid+'|'+r.b.moyGen+'|'+r.rang+'|'+K.eff,carte:()=>carteResultats(r.e,S.trim,r,K.eff)};
}
function telecharger(blob,nom){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nom;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function envoyerImage(kind,eid){
  const M=S.msg;if(M.busy)return;const P=preparer(kind,eid);if(!P){toast('Cet élève n\'a pas de note à envoyer.');return}
  M.busy=true;
  try{
    let file=M.pret&&M.pret.cle===P.cle?M.pret.file:null;
    if(!file){const cv=await P.carte(),blob=await new Promise(ok=>cv.toBlob(ok,'image/png'));file=new File([blob],P.nom,{type:'image/png'})}
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});M.pret=null;noterEnvoi(kind,eid);toast('Image envoyée. Touchez « 2. Message » pour le texte.')}
      catch(err){if(err&&err.name==='NotAllowedError'){M.pret={cle:P.cle,file};toast('Image prête : touchez encore « Image ».')}
        else if(!(err&&err.name==='AbortError'))toast('Partage impossible : '+(err&&err.message||err))}
    }else{
      // Téléphone ou navigateur sans partage d'image : l'image est enregistrée, puis la discussion du parent s'ouvre
      // Navigateur sans partage d'image : l'image est enregistrée dans le téléphone
      telecharger(file,P.nom);noterEnvoi(kind,eid);toast('Image enregistrée : touchez « 2. Message », puis joignez l\'image avec le trombone 📎.')}
  }finally{M.busy=false}
}

/* Contacts des parents d'une classe, à importer une fois dans le téléphone */
function contactsVcf(c){
  const els=elevesOf(c).filter(e=>telDigits(e.parent_tel));if(!els.length){toast('Aucun numéro de parent en '+c+'.');return}
  const vc=s=>String(s||'').replace(/([\\,;])/g,'\\$1');
  const v=els.map(e=>{const n='Parent '+nomEleve(e)+' '+c.replace(/\s/g,'');return ['BEGIN:VCARD','VERSION:3.0','FN:'+vc(n),'N:'+vc(n)+';;;;','TEL;TYPE=CELL:+'+telDigits(e.parent_tel),'NOTE:'+vc((e.parent_nom?e.parent_nom+' - ':'')+S.ecole),'END:VCARD'].join('\r\n')}).join('\r\n')+'\r\n';
  telecharger(new Blob([v],{type:'text/vcard'}),'Parents_'+c.replace(/\s/g,'')+'.vcf');

function boutonsEnvoi(kind,e,deja){
  const tel=telDigits(e.parent_tel),P=tel?preparer(kind,e.id):null;
  if(!tel)return '<span class="row"><button class="btn sm" data-act="el-edit" data-id="'+e.id+'">Ajouter le n° du parent</button></span>';
  if(!P)return '';
  return '<span class="row"><button class="btn sm wa" data-act="msg-img" data-k="'+kind+'" data-eid="'+e.id+'" aria-label="Envoyer l\'image au parent de '+esc(nomEleve(e))+'">'+ICO_IMG+(deja?'Renvoyer l\'image':'1. Image')+'</button>'+
    '<a class="btn sm" href="'+esc(waLink(e.parent_tel,P.msg))+'" target="_blank" rel="noopener" data-act="msg-txt" data-k="'+kind+'" data-eid="'+e.id+'" aria-label="Envoyer le message WhatsApp au parent de '+esc(nomEleve(e))+'">'+ICO_WA+'2. Message</a></span>';
}
function ligneAlerte(a,mode){
  const e=a.e,tel=telDigits(e.parent_tel),fait=S.msg.suivis[a.cle],prog=a.type==='prog';
  const msg=mode==='suivi'?msgSuivi(e,a.devs):prog?msgProg(e,a.t,a.avant,a.apres):msgEncour(e,a.devs);
  const det=prog?'T'+(a.t-1)+' : '+fmt(a.avant)+' → T'+a.t+' : <b class="hi">'+fmt(a.apres)+'</b>':a.devs.map(d=>esc(matName(d.matiere))+' <b class="'+(mode==='suivi'?'low':'hi')+'">'+fmtN(noteDe(d,e.id))+'</b>').join(' · ');
  return '<div class="li m"><span class="no small">'+(prog?'T'+a.t:dateFr(a.dernier.date))+'</span><span><b>'+esc(nomEleve(e))+'</b>'+(fait?' <span class="badge ok">envoyé</span>':'')+'<br><span class="small">'+det+'</span></span><span class="row">'+
    (tel?'<a class="btn sm wa" href="'+esc(waLink(e.parent_tel,msg))+'" target="_blank" rel="noopener" data-act="msg-suivi" data-cle="'+esc(a.cle)+'" data-eid="'+e.id+'" data-devs="'+a.devs.map(d=>d.id).join(',')+'">'+ICO_WA+(fait?'Renvoyer':mode==='suivi'?'Prévenir le parent':'Féliciter le parent')+'</a>':'<button class="btn sm" data-act="el-edit" data-id="'+e.id+'">Ajouter le n° du parent</button>')+'</span></div>';
}
function carteAlertes(items,mode,titre,expl){
  if(!items.length)return '';const af=items.filter(a=>!S.msg.suivis[a.cle]),faits=items.filter(a=>S.msg.suivis[a.cle]);
  let h='<div class="card '+(mode==='suivi'?'suivi':'encour')+'"><h2>'+titre+(af.length?' · '+af.length:'')+'</h2><p class="small">'+expl+'</p>';
  h+=af.length?'<div class="list">'+af.map(a=>ligneAlerte(a,mode)).join('')+'</div>':'<p class="small"><b>Tous les parents concernés ont reçu le message.</b></p>';
  if(faits.length)h+='<details><summary class="small">Déjà envoyés · '+faits.length+'</summary><div class="list" style="margin-top:8px">'+faits.map(a=>ligneAlerte(a,mode)).join('')+'</div></details>';
  return h+'</div>';
}
const noticeScript=()=>'<div class="notice warn"><b>Messages pas encore activés dans la base</b><p class="small">Il faut exécuter une fois le script « Messages aux parents » dans l\'éditeur SQL de Supabase. En attendant, les messages partent quand même, mais la page ne peut pas retenir qui a déjà été prévenu.</p></div>';
function viewMessages(){
  const M=S.msg,c=CLASSES.includes(M.classe)?M.classe:(S.classe||CLASSES[0]);M.classe=c;
  const els=elevesOf(c),st=els.filter(e=>!telDigits(e.parent_tel)).length;
  let h='<div class="card"><h2>Messages aux parents</h2><div class="chips" role="group" aria-label="Classe">'+CLASSES.map(k=>'<button class="chip" data-act="msgcl" data-c="'+k+'" aria-pressed="'+(k===c)+'">'+k+'</button>').join('')+'</div>'+trimChips()+
    '<p class="small muted">'+els.length+' élève'+(els.length>1?'s':'')+' en '+esc(c)+(st?' · <b>'+st+' sans numéro de parent</b>':'')+'</p>'+
    '<div class="row"><button class="btn sm" data-act="msg-vcf">Contacts des parents de '+esc(c)+'</button></div>'+
    '<p class="small muted">Ce bouton crée un fichier de contacts (« Parent NOM Prénom '+esc(c.replace(/\s/g,''))+' ») à ouvrir une fois sur le téléphone qui envoie les messages : dans WhatsApp, chaque parent se retrouve alors en tapant le nom de l\'élève.</p></div>';
  if(M.manque)h+=noticeScript();else if(M.err)h+='<div class="notice warn small">'+esc(M.err)+'</div>';
  if(!els.length)return h+'<div class="notice warn"><b>Aucun élève en '+esc(c)+'</b><p class="small">Ajoutez d\'abord les élèves de la classe, avec le numéro WhatsApp du parent.</p><div><button class="btn sm" data-act="go-eleves" data-c="'+esc(c)+'">Ajouter les élèves de '+esc(c)+'</button></div></div>';
  if(!M.charge[c]&&!M.manque&&!M.err)h+='<p class="small muted">'+(S.online?'Chargement des notes de la classe…':'Hors connexion : les envois déjà faits s\'afficheront au retour du réseau.')+'</p>';
  h+=carteAlertes(alertesSuivi(c),'suivi','Suivi à faire','Ces élèves ont eu trois devoirs de suite en dessous de 10/20 (toutes matières, absences non comptées). Le message demande au parent plus de suivi et l\'invite à passer à l\'école.');
  h+=carteAlertes([...encouragements(c),...progressions(c,S.trim)],'enc','Encouragements à envoyer','Trois bonnes notes de devoir de suite (16/20 et plus, 13/20 et plus en Rédaction), ou moyenne en hausse d\'au moins 2 points sur le trimestre précédent.');
  const devs=vueEvals().filter(e=>e.type==='devoir'&&e.classe===c&&e.trimestre===S.trim&&(e.annee||S.annee)===S.annee).sort((a,b)=>String(b.date||'').localeCompare(a.date||'')||String(b.cree_le||'').localeCompare(a.cree_le||''));
  h+='<h2>Notes de devoir · '+trimName(S.trim)+'</h2>';
  if(!devs.length)h+='<p class="small muted">Aucun devoir saisi en '+esc(c)+' ce trimestre.</p>';
  else h+='<div class="list">'+devs.map(d=>{const av=els.filter(e=>noteDe(d,e.id)!=null),env=av.filter(e=>(M.envD[d.id]||{})[e.id]).length;
    return '<div class="li"><span class="no small">'+dateFr(d.date)+'</span><span><b>'+esc(matName(d.matiere))+' · '+esc(d.titre||'Devoir')+'</b><br><span class="small '+(av.length&&env>=av.length?'hi':'muted')+'">Parents prévenus : '+env+'/'+av.length+'</span></span><button class="btn sm'+(env<av.length?' wa':'')+'" data-act="msg-dev" data-id="'+d.id+'"'+(av.length?'':' disabled')+'>'+(env<av.length?'Prévenir':'Revoir')+'</button></div>'}).join('')+'</div>';
  const K=ctxRes(c,S.trim),avecMoy=K.res.filter(r=>num(r.b.moyGen)),envB=avecMoy.filter(r=>M.envB[S.trim+'_'+r.e.id]).length;
  h+='<h2>Résultats du '+trimName(S.trim)+'</h2><div class="list"><div class="li"><span class="no small"></span><span><b>Moyenne et rang de chaque élève</b><br><span class="small muted">'+(avecMoy.length?'Envoyés : '+envB+'/'+avecMoy.length:'Pas encore de moyenne ce trimestre')+'</span></span><button class="btn sm'+(avecMoy.length&&envB<avecMoy.length?' wa':'')+'" data-act="msg-bul"'+(avecMoy.length?'':' disabled')+'>Envoyer</button></div></div>';
  return h+'<p class="small muted">Les notes de composition ne sont jamais envoyées aux parents. Un élève absent à un devoir ne reçoit pas de message.</p>';
}
function aideEnvoi(){
  return '<ul class="steps small"><li><b>1. Image</b> (en premier) : choisissez WhatsApp, puis le parent. Astuce : enregistrez une fois les « Contacts des parents » de la classe (onglet Messages) ; il suffit alors de taper le nom de l\'élève pour trouver son parent.</li><li><b>2. Message</b> (ensuite, à part) : la discussion du parent s\'ouvre toute seule avec le texte déjà écrit. Touchez la flèche d\'envoi.</li></ul>';
}
function viewMsgDevoir(){
  const M=S.msg,d=vueEvals().find(x=>x.id===M.evalId);if(!d){S.view=null;return viewMessages()}
  const els=elevesOf(d.classe).filter(e=>noteDe(d,e.id)!=null),env=M.envD[d.id]||{},n=els.filter(e=>env[e.id]).length;
  let h='<button class="btn ghost" data-act="msg-back">← Messages</button>';
  if(M.manque)h+=noticeScript();
  const nouv=alertesSuivi(d.classe).filter(a=>a.dernier.id===d.id),bons=encouragements(d.classe).filter(a=>a.dernier.id===d.id);
  h+=carteAlertes(nouv,'suivi','Suivi à faire','Avec ce devoir, '+(nouv.length>1?'ces élèves ont':'cet élève a')+' trois notes de suite en dessous de 10/20.');
  h+=carteAlertes(bons,'enc','Encouragements à envoyer','Avec ce devoir, '+(bons.length>1?'ces élèves ont':'cet élève a')+' trois bonnes notes de suite.');
  h+='<div class="card"><h2>'+esc(matName(d.matiere))+' · '+esc(d.titre||'Devoir')+'</h2><p class="small muted">'+esc(d.classe)+' · '+(d.date?dateLong(d.date)+' · ':'')+'Parents prévenus : <b>'+n+'/'+els.length+'</b></p>'+aideEnvoi()+
    (els.length?'<div class="prev"><span class="small muted">Aperçu de l\'image (premier élève)</span><img id="msgPrev" data-eid="'+els[0].id+'" alt="Aperçu de la fiche de note"></div>':'')+'</div>';
  h+='<div class="list">'+els.map((e,i)=>{const v=noteDe(d,e.id),tel=telDigits(e.parent_tel);
    return '<div class="li m"><span class="no">'+(i+1)+'</span><span><b>'+esc(nomEleve(e))+'</b> · <span class="'+cls(v)+'">'+fmtN(v)+'/20</span>'+(env[e.id]?' <span class="badge ok">envoyé</span>':'')+'<br><span class="small muted">'+(tel?telAff(tel):'Pas de numéro WhatsApp')+'</span></span>'+boutonsEnvoi('dev',e,!!env[e.id])+'</div>'}).join('')+'</div>';
  return h;

function viewMsgBul(){
  const M=S.msg,c=M.classe,K=ctxRes(c,S.trim),liste=K.res.filter(r=>num(r.b.moyGen)).sort((a,b)=>String(a.e.nom).localeCompare(b.e.nom,'fr')||String(a.e.prenom).localeCompare(b.e.prenom,'fr'));

    (liste.length?'<div class="prev"><span class="small muted">Aperçu de l\'image (premier élève)</span><img id="msgPrev" data-eid="'+liste[0].e.id+'" alt="Aperçu de la fiche de résultats"></div>':'')+'</div>';

/* ----- Réglages (directeur seul) : comptes, classes et matières des enseignants, matières, école ----- */
S.reg={sec:'ens',etat:null,err:'',form:null,busy:false,manque:false};
const NIVEAUX=['7','8','9'];
function errRpc(e){const m=String(e&&e.message||'');
  if(e&&(e.code==='PGRST202'||/could not find the function|schema cache/i.test(m))){S.reg.manque=true;return 'La base n\'est pas encore prête pour les réglages (script à exécuter dans Supabase).'}
  if(estReseau(e))return 'Pas de réseau : réessayez quand la connexion revient.';
  return m||'Erreur inconnue'}
async function rpc(f,args){const r=await sb.rpc(f,args);if(r.error)throw r.error;return r.data}
async function chargerReglages(){
  if(!isDir())return;
  try{S.reg.etat=await rpc('admin_etat',{p_annee:S.annee});S.reg.err='';S.reg.manque=false}
  catch(e){S.reg.err=errRpc(e)}
  if(S.tab==='reglages')render();
}
const roleNom=r=>ROLES[r]||r;
function viewReglages(){
  const R=S.reg;
  if(R.form)return R.form.type==='compte'?viewFormCompte():R.form.type==='matiere'?viewFormMatiere():viewReglages();
  const sec=(k,l)=>'<button class="chip" data-act="rg-sec" data-k="'+k+'" aria-pressed="'+(R.sec===k)+'">'+l+'</button>';
  let h='<div class="card"><h2>Réglages</h2><div class="chips">'+sec('ens','Enseignants et comptes')+sec('mat','Matières')+sec('eco','École')+sec('sav','Sauvegarde')+'</div><p class="small muted">Réservé au directeur.</p></div>';
  if(R.manque)h+='<div class="notice warn"><b>Réglages pas encore activés</b><p class="small">Il faut d\'abord exécuter le script « Réglages du directeur » dans l\'éditeur SQL de Supabase (une seule fois).</p></div>';
  else if(R.err)h+='<div class="notice warn small">'+esc(R.err)+'</div>';
  if(R.sec==='ens')return h+viewComptes();
  if(R.sec==='mat')return h+viewMatieres();
  if(R.sec==='sav')return h+viewSauvegarde();
  return h+viewEcole();
}
function viewComptes(){
  const E=S.reg.etat;
  let h='<div class="row between"><h2>Comptes</h2><button class="btn primary" data-act="rg-new-compte"'+(S.reg.manque?' disabled':'')+'>+ Nouveau compte</button></div>';
  if(!E)return h+(S.reg.manque?'':'<div class="card"><p class="muted">Chargement…</p></div>');
  const aff=E.affectations||[],ordre={directeur:0,secretariat:1,enseignant:2};
  const cs=[...E.comptes].sort((a,b)=>(b.actif-a.actif)||(ordre[a.role]-ordre[b.role])||String(a.nom).localeCompare(b.nom,'fr'));
  h+='<div class="list">'+cs.map(c=>{const mine=aff.filter(a=>a.user_id===c.id);
    const det=c.role==='enseignant'?(mine.length?[...new Set(mine.map(a=>a.classe))].sort().map(cl=>cl+' : '+mine.filter(a=>a.classe===cl).map(a=>matName(a.matiere)).join(', ')).join(' · '):'Aucune classe attribuée'):roleNom(c.role);
    return '<div class="li"><span class="no small">'+(c.actif?'':'⏸')+'</span><span><b>'+esc(c.nom)+'</b>'+(c.actif?'':' <span class="badge warn">désactivé</span>')+'<br><span class="small muted">'+esc(c.identifiant)+' · '+esc(det)+'</span></span><button class="btn sm" data-act="rg-edit-compte" data-id="'+c.id+'">Modifier</button></div>'}).join('')+'</div>';
  return h+'<p class="small muted">Un enseignant qui part : désactivez son compte. Ses notes et l\'historique de ses saisies restent.</p>';
}
function ouvrirCompte(id){
  const E=S.reg.etat;let f;
  if(id){const c=E.comptes.find(x=>x.id===id);if(!c)return;
    f={type:'compte',id,identifiant:c.identifiant,nom:c.nom,role:c.role,actif:c.actif,mdp:'',aff:{}};
    (E.affectations||[]).filter(a=>a.user_id===id).forEach(a=>f.aff[a.classe+'|'+a.matiere]=true)}
  else f={type:'compte',id:null,identifiant:'',nom:'',role:'enseignant',actif:true,mdp:'',aff:{}};
  f.affAvant=JSON.stringify(Object.keys(f.aff).sort());
  S.reg.form=f;S.reg.err='';S.confirm=null;render(true);window.scrollTo(0,0);
}

    '<div class="field"><label for="rg-mdp">'+(neuf?'Mot de passe * (6 caractères au moins)':'Nouveau mot de passe (laisser vide pour ne pas changer)')+'</label><input id="rg-mdp" data-rg="mdp" value="'+esc(f.mdp)+'" autocomplete="off" autocapitalize="none" spellcheck="false"></div></div>';
  if(!neuf&&!moi)h+='<label class="row small"><input type="checkbox" data-rg="actif"'+(f.actif?' checked':'')+' style="width:22px;height:22px"> Compte actif (décochez pour désactiver : la personne ne peut plus se connecter)</label>';

    h+='<div class="card"><h2>Classes et matières · '+esc(S.annee)+'</h2><p class="small muted">Touchez les matières que cet enseignant enseigne dans chaque classe.</p>';

    h+='</div>';
  }
  h+=(S.reg.err?'<p class="err">'+esc(S.reg.err)+'</p>':'')+'<div class="row"><button class="btn primary" data-act="rg-save-compte"'+(S.reg.busy?' disabled':'')+'>'+(S.reg.busy?'Enregistrement…':'Enregistrer')+'</button><button class="btn" data-act="rg-close">Annuler</button></div>';
  return h;

async function enregistrerCompte(){
  const f=S.reg.form,neuf=!f.id;
  if(!String(f.nom).trim()){S.reg.err='Le nom est obligatoire.';render(true);return}
  if(neuf&&!String(f.identifiant).trim()){S.reg.err='L\'identifiant est obligatoire.';render(true);return}
  if((neuf||f.mdp)&&String(f.mdp).length<6){S.reg.err='Le mot de passe doit avoir au moins 6 caractères.';render(true);return}
  S.reg.busy=true;S.reg.err='';render(true);
  try{
    let id=f.id;
    if(neuf)id=await rpc('admin_creer_compte',{p_identifiant:f.identifiant.trim().toLowerCase(),p_nom:f.nom.trim(),p_role:f.role,p_mdp:f.mdp});
    else{await rpc('admin_modifier_compte',{p_id:id,p_nom:f.nom.trim(),p_role:f.role,p_actif:!!f.actif});
      if(f.mdp)await rpc('admin_mot_de_passe',{p_id:id,p_mdp:f.mdp})}
    const cles=Object.keys(f.aff).filter(k=>f.aff[k]).sort(),liste=f.role==='enseignant'?cles:[];
    if(neuf?liste.length:JSON.stringify(liste)!==f.affAvant)
      await rpc('admin_affectations',{p_user:id,p_annee:S.annee,p_liste:liste.map(k=>{const [classe,matiere]=k.split('|');return {classe,matiere}})});
    S.reg.busy=false;S.reg.form=null;
    toast(neuf?'Compte créé : '+f.identifiant.trim().toLowerCase()+' / '+f.mdp:(f.mdp?'Compte et mot de passe enregistrés.':'Compte enregistré.'));
    await chargerReglages();rafraichir();
  }catch(e){S.reg.busy=false;S.reg.err=errRpc(e);render(true)}
}
function viewMatieres(){
