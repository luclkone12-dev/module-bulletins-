  return h+'<p class="small muted">L\'ordre fixe la place de la matière sur le bulletin.</p>';
}
function ouvrirMatiere(id){
  const m=id?S.matieres.find(x=>x.id===id):null;
  const f={type:'matiere',id:m?m.id:null,nom:m?m.nom:'',ordre:m?String(m.ordre??''):String(S.matieres.reduce((x,y)=>Math.max(x,y.ordre||0),0)+1),niv:{},coef:{}};
  NIVEAUX.forEach(n=>{f.niv[n]=m?(m.niveaux||[]).includes(n):true;f.coef[n]=m&&m.coefs&&m.coefs[n]!=null?fmtN(Number(m.coefs[n])):'1'});
  S.reg.form=f;S.reg.err='';S.confirm=null;render(true);window.scrollTo(0,0);
}

async function enregistrerMatiere(){
  const f=S.reg.form;if(!String(f.nom).trim()){S.reg.err='Le nom est obligatoire.';render(true);return}
  const niveaux=NIVEAUX.filter(n=>f.niv[n]),coefs={};
  for(const n of niveaux){const c=parseNote(f.coef[n],20);if(c==null||Number.isNaN(c)||c<=0){S.reg.err='Coefficient invalide en '+n+'e.';render(true);return}coefs[n]=c}
  const ordre=parseInt(f.ordre,10);
  S.reg.busy=true;S.reg.err='';render(true);
  try{await rpc('admin_matiere',{p_id:f.id||null,p_nom:f.nom.trim(),p_niveaux:niveaux,p_coefs:coefs,p_ordre:isFinite(ordre)?ordre:null});
    S.reg.busy=false;S.reg.form=null;toast('Matière enregistrée.');await rafraichir()}
  catch(e){S.reg.busy=false;S.reg.err=errRpc(e);render(true)}
}
async function retirerMatiere(){
  const f=S.reg.form;S.reg.busy=true;render(true);
  try{const r=await rpc('admin_retirer_matiere',{p_id:f.id});S.reg.busy=false;S.reg.form=null;S.confirm=null;
    toast(r==='supprimee'?'Matière supprimée.':'Matière retirée des bulletins (ses notes restent).');await rafraichir();chargerReglages()}
  catch(e){S.reg.busy=false;S.confirm=null;S.reg.err=errRpc(e);render(true)}
}

      .sort((a,b)=>String(a['Année']).localeCompare(b['Année'])||a.Trimestre-b.Trimestre||CLASSES.indexOf(a.Classe)-CLASSES.indexOf(b.Classe)||a['Matière'].localeCompare(b['Matière'],'fr')||String(a.Date).localeCompare(b.Date)||a.Nom.localeCompare(b.Nom,'fr')||a['Prénom'].localeCompare(b['Prénom'],'fr'));

    feuille('Notes',lignesNotes,[10,9,7,22,12,14,11,12,18,18,7,5,16,9,38,38]);
    feuille('Élèves',els.map(e=>({'Classe':e.classe||'','Matricule':e.matricule||'','Nom':e.nom||'','Prénom':e.prenom||'','Sexe':e.sexe||'','Né(e) le':e.naissance_date||'','à':e.naissance_lieu||'','Parent':e.parent_nom||'','Téléphone parent':e.parent_tel||'','Père':e.pere||'','Mère':e.mere||'','id élève':e.id})),[7,12,18,18,5,12,14,20,16,18,18,38]);
    feuille('Matières',mats.map(m=>({'Matière':m.nom,'Niveaux':(m.niveaux||[]).join(', '),'Coef 7e':(m.coefs||{})['7']??'','Coef 8e':(m.coefs||{})['8']??'','Coef 9e':(m.coefs||{})['9']??'','Ordre':m.ordre,'id matière':m.id})),[24,10,8,8,8,7,20]);
    feuille('Évaluations',evs.map(v=>({'Année':v.annee,'Trimestre':v.trimestre,'Classe':v.classe,'Matière':(M[v.matiere]||{}).nom||v.matiere,'Type':v.type==='compo'?'Composition':'Devoir','Titre':v.titre||'','Date':v.date||'','Saisi par':(P[v.cree_par]||{}).nom||'','id évaluation':v.id,'id matière':v.matiere})),[10,9,7,22,12,14,11,20,38,20]);
    feuille('Enseignants',aff.map(a=>({'Année':a.annee,'Enseignant':(P[a.user_id]||{}).nom||'','Identifiant':(P[a.user_id]||{}).identifiant||'','Classe':a.classe,'Matière':(M[a.matiere]||{}).nom||a.matiere})).sort((a,b)=>a.Enseignant.localeCompare(b.Enseignant,'fr')||CLASSES.indexOf(a.Classe)-CLASSES.indexOf(b.Classe)),[10,24,16,7,22]);

/* ----- Examens blancs du DEF (9e A et 9e B) -----
   Notes sur 20 dans les 8 matières du DEF, avec les coefficients du bulletin de 9e.
   - La direction et le secrétariat créent les examens blancs et peuvent tout saisir ;
     chaque enseignant saisit ses propres matières de 9e depuis l'onglet Notes.
   - Moyenne = Σ(note × coef) ÷ Σ(coef des matières notées) ; incomplète (*) tant qu'une matière manque.
   - Élève à risque : moyenne ≤ 9,99. Le message aux parents part du WhatsApp du téléphone utilisé. */
const DEF_MATS=['redaction','dictee','histgeo','maths','sciences','pc','ecm','anglais'];
const CLASSES_DEF=CLASSES.filter(c=>c[0]==='9');
S.def={exams:[],notes:{},charge:false,examId:null,classe:null,form:null,saisie:null,confirm:false,busy:false,err:''};
const defMats=()=>DEF_MATS.map(id=>S.matieres.find(m=>m.id===id)).filter(Boolean);
const defExam=id=>S.def.exams.find(x=>x.id===id);
const defRisque=v=>num(v)&&Math.round(v*100)/100<=9.99;
const defConcerne=()=>isBureau()||mesCours().some(c=>c.classe[0]==='9'&&DEF_MATS.includes(c.matiere));
async function chargerDef(){
  if(!sb||!S.uid||!S.profil||!defConcerne())return;
  try{
    const ex=chk(await sb.from('examens').select('id,annee,titre,date,cree_le').eq('annee',S.annee).order('date',{ascending:true,nullsFirst:true}).order('cree_le',{ascending:true}));
    const notes={};ex.forEach(x=>notes[x.id]={});
    if(ex.length){const rows=await fetchAll(()=>sb.from('notes_examen').select('examen_id,eleve_id,matiere,classe,note').in('examen_id',ex.map(x=>x.id)));
      rows.forEach(r=>{const n=notes[r.examen_id]||(notes[r.examen_id]={});(n[r.eleve_id]||(n[r.eleve_id]={}))[r.matiere]=r.note==null?null:Number(r.note)})}
    S.def.exams=ex;S.def.notes=notes;S.def.charge=true;S.def.err='';
    if(!defExam(S.def.examId))S.def.examId=ex.length?ex[ex.length-1].id:null;
  }catch(e){if(estReseau(e))S.online=false;else S.def.err=tableManque(e)?'Les examens blancs ne sont pas encore installés dans la base.':msgErreur(e)}
  if(!enFormulaire())render();
}
function defResultats(xid,c){
  const N=S.def.notes[xid]||{},mats=defMats();
  const res=elevesOf(c).map(e=>{const n=N[e.id]||{};let pts=0,sc=0,k=0;
    mats.forEach(m=>{const v=n[m.id];if(num(v)){const co=coefFor(m,'9');pts+=v*co;sc+=co;k++}});
    return {e,n,moy:sc?pts/sc:null,nb:k,complet:k===mats.length}});
  rankList(res,r=>r.moy);
  return res;
}
const defCompte=(xid,c,m)=>{const N=S.def.notes[xid]||{};return elevesOf(c).filter(e=>num((N[e.id]||{})[m])).length};
function msgDef(e,x,r){return bonjour(e)+'Votre enfant '+enfantTxt(e)+', a obtenu une moyenne de *'+fmt(r.moy)+'/20* à l\'examen blanc du DEF ('+x.titre+(x.date?' du '+dateLong(x.date):'')+').\nCette moyenne est insuffisante pour réussir le DEF. Nous vous demandons plus de rigueur et de suivi à la maison dans la préparation de l\'examen. Merci de passer à l\'école pour en parler avec nous.\n\n'+signature()}

/* Bloc affiché aux enseignants de 9e dans l'onglet Notes */
function blocDefSaisie(){
  if(!S.classe||S.classe[0]!=='9'||!DEF_MATS.includes(S.matiere)||!S.def.charge)return '';
  let h='<h2>Examens blancs du DEF · '+esc(matName(S.matiere))+'</h2>';
  if(!S.def.exams.length)return h+'<p class="small muted">La direction n\'a pas encore créé d\'examen blanc.</p>';
  const eff=elevesOf(S.classe).length;
  return h+'<div class="list">'+S.def.exams.map(x=>{const k=defCompte(x.id,S.classe,S.matiere);
    return '<div class="li"><span class="no small">'+(eff&&k>=eff?'✓':dateFr(x.date))+'</span><span><b>'+esc(x.titre)+'</b><br><span class="small muted">'+(x.date?dateLong(x.date)+' · ':'')+k+'/'+eff+' notes sur 20</span></span><button class="btn sm" data-act="def-saisir" data-x="'+x.id+'" data-c="'+esc(S.classe)+'" data-m="'+esc(S.matiere)+'">'+(k?'Modifier':'Saisir')+'</button></div>'}).join('')+'</div>';
}

/* Onglet DEF (direction et secrétariat) */
function viewDef(){
  const D=S.def;if(!CLASSES_DEF.includes(D.classe))D.classe=CLASSES_DEF[0];
  let h='<div class="card"><div class="row between"><h2>Examens blancs du DEF</h2><button class="btn primary" data-act="def-new">+ Nouvel examen blanc</button></div>';
  if(D.form){const f=D.form;
    h+='<div class="form"><div class="field"><label for="dx-titre">Titre</label><input id="dx-titre" data-dfx="titre" value="'+esc(f.titre)+'"></div><div class="field"><label for="dx-date">Date</label><input id="dx-date" type="date" data-dfx="date" value="'+esc(f.date||'')+'"></div></div>'+
      (D.err?'<p class="err">'+esc(D.err)+'</p>':'')+'<div class="row"><button class="btn primary" data-act="def-form-save"'+(D.busy?' disabled':'')+'>'+(D.busy?'Enregistrement…':'Enregistrer')+'</button><button class="btn" data-act="def-form-close">Annuler</button>';
    if(f.id)h+=D.confirm?'<div class="confirm"><span>Supprimer <b>'+esc(f.titre)+'</b> et toutes ses notes ?</span><button class="btn sm danger" data-act="def-del-yes">Oui, supprimer</button><button class="btn sm" data-act="def-del-no">Non</button></div>':'<button class="btn danger" data-act="def-del">Supprimer</button>';
    return h+'</div></div>';
  }
  if(!D.charge)return h+'<p class="small muted">'+(D.err?esc(D.err):(S.online?'Chargement…':'Hors connexion : les examens blancs s\'afficheront au retour du réseau.'))+'</p></div>';

/* ----- Personnes connectées (présence en temps réel) -----
   Chaque page ouverte signale sa présence sur un canal Supabase Realtime, sans rien écrire dans la base.
   Le signal ne contient que l'identifiant interne du compte et l'écran ouvert ; le directeur retrouve les noms
   dans les profils. Une page passée en arrière-plan (téléphone verrouillé, autre application) se retire. */
const PR={ch:null,etat:'',sig:'',depuis:0};
function presenceActivite(){
  if(!S.profil)return '';
  if(S.tab==='saisie'||!isBureau()){const c=[S.classe,matName(S.matiere)].filter(Boolean).join(' · ');return (S.view==='edit'?'Saisit des notes':'Notes')+(c?' · '+c:'')}
  return ({def:'Examens blancs du DEF',bulletins:'Bulletins',messages:'Messages aux parents',eleves:'Élèves',direct:'En direct',reglages:'Réglages'})[S.tab]||'';
}
function presenceSignal(){
  if(!PR.ch||PR.etat!=='SUBSCRIBED')return;
  if(document.visibilityState!=='visible'){if(PR.sig){PR.sig='';PR.ch.untrack().catch(()=>{})}return}
  const a=presenceActivite(),sig=S.uid+'|'+a;if(sig===PR.sig)return;PR.sig=sig;
  if(!PR.depuis)PR.depuis=Date.now();
  PR.ch.track({u:S.uid,a,depuis:PR.depuis,maj:Date.now()}).catch(()=>{PR.sig=''});
}
function demarrerPresence(){
  if(PR.ch||!sb||!S.uid||!S.profil||!sb.channel)return;
  try{
    PR.ch=sb.channel('bn-presence',{config:{presence:{key:S.uid}}});
    PR.ch.on('presence',{event:'sync'},()=>{majPresents()});
    PR.ch.subscribe(st=>{PR.etat=st;if(st==='SUBSCRIBED'){PR.sig='';presenceSignal()}majPresents()});
  }catch(_){PR.ch=null}
}
async function arreterPresence(){if(PR.ch){try{await PR.ch.untrack();await sb.removeChannel(PR.ch)}catch(_){}PR.ch=null;PR.etat='';PR.sig=''}}
async function majPresents(){
  if(!isDir()||!PR.ch)return;
  const st=PR.ch.presenceState(),L=[];
  Object.keys(st).forEach(k=>{const m=(st[k]||[]).slice().sort((x,y)=>(y.maj||0)-(x.maj||0))[0];if(m&&k!==S.uid)L.push({u:k,a:m.a||'',depuis:m.depuis||m.maj||Date.now()})});
  S.presents=L;
  const inconnus=L.map(p=>p.u).filter(u=>!S.noms[u]||!S.rolesP[u]);
  if(inconnus.length&&S.online){try{const pf=chk(await sb.from('profils').select('id,nom,role').in('id',inconnus));pf.forEach(p=>{S.noms[p.id]=p.nom;S.rolesP[p.id]=p.role})}catch(_){}}
  S.presents.sort((x,y)=>(S.noms[x.u]||'').localeCompare(S.noms[y.u]||'','fr'));
  renderHead();if(S.tab==='direct'&&S.view!=='edit')render();
}
function viewPresents(){
  const L=S.presents||[];
  let h='<div class="card pres"><div class="row between"><h2>Connectés maintenant</h2><span class="badge'+(L.length?' ok':'')+'">'+L.length+' en ligne</span></div>';
  if(PR.etat!=='SUBSCRIBED')return h+'<p class="small muted">'+(S.online?'Connexion au suivi en cours…':'Hors connexion : la liste reviendra avec le réseau.')+'</p></div>';
  if(!L.length)return h+'<p class="small muted">Personne d\'autre n\'a la page ouverte en ce moment.</p></div>';
  h+='<ul class="pres-l">'+L.map(p=>'<li><span class="dot"></span><span class="pres-t"><b>'+esc(S.noms[p.u]||'Compte')+'</b> <span class="small muted">'+esc(ROLES[S.rolesP[p.u]]||'')+'</span><br><span class="small">'+esc(p.a||'Page ouverte')+'</span></span><span class="small muted pres-h">depuis '+heure(p.depuis)+'</span></li>').join('')+'</ul>';
  return h+'<p class="small muted">Une personne apparaît ici tant que la page est ouverte à l\'écran sur son téléphone.</p></div>';
}

document.addEventListener('submit',async ev=>{
  const f=ev.target;if(f.dataset.form!=='login')return;ev.preventDefault();
  const id=f.id.value.trim().toLowerCase(),pw=f.pw.value;if(!id||!pw)return;
  S.busy=true;S.err='';render(true);
  try{const {data,error}=await sb.auth.signInWithPassword({email:id.includes('@')?id:id+DOMAINE,password:pw});
    if(error)throw error;
    S.uid=data.user.id;S.busy=false;loadCache();render(true);await rafraichir();
  }catch(e){S.busy=false;S.err=estReseau(e)?'Pas de connexion Internet. La première connexion demande du réseau.':'Identifiant ou mot de passe incorrect.';render(true)}
});
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-act]');if(!b||b.tagName==='SELECT')return;
  const a=b.dataset.act;
  if(a==='tab'){S.tab=b.dataset.k;S.view=null;if(S.tab==='def')chargerDef();if(S.tab==='bulletins'&&!S.bulClasse)S.bulClasse=S.classe||CLASSES[0];if(S.tab==='messages'){if(!S.msg.classe)S.msg.classe=S.classe||CLASSES[0];render(true);window.scrollTo(0,0);chargerMessages();return}render(true);if(S.tab==='direct')chargerFeed();if(S.tab==='bulletins')chargerBulletins();if(S.tab==='reglages'){S.reg.form=null;chargerReglages()}return}
  if(a==='sav-go'){faireSauvegarde();return}
  if(a==='sav-ouvrir'){S.tab='reglages';S.view=null;S.reg.sec='sav';S.reg.form=null;render(true);window.scrollTo(0,0);return}
  if(a==='rg-sec'){S.reg.sec=b.dataset.k;S.reg.err='';render(true);if(b.dataset.k==='ens'&&!S.reg.etat)chargerReglages();return}
  if(a==='rg-new-compte')return ouvrirCompte(null);
  if(a==='rg-edit-compte')return ouvrirCompte(b.dataset.id);
  if(a==='rg-aff'){const f=S.reg.form,k=b.dataset.k;f.aff[k]=!f.aff[k];b.setAttribute('aria-pressed',String(!!f.aff[k]));return}
  if(a==='rg-save-compte'){if(!S.reg.busy)enregistrerCompte();return}
  if(a==='rg-close'){S.reg.form=null;S.reg.err='';S.confirm=null;render(true);return}
  if(a==='rg-new-mat')return ouvrirMatiere(null);
  if(a==='rg-edit-mat')return ouvrirMatiere(b.dataset.id);
  if(a==='rg-save-mat'){if(!S.reg.busy)enregistrerMatiere();return}
  if(a==='rg-del-mat'){S.confirm='rg-del-mat';render(true);return}
  if(a==='rg-del-mat-no'){S.confirm=null;render(true);return}
  if(a==='rg-del-mat-yes'){if(!S.reg.busy)retirerMatiere();return}
  if(a==='rg-save-eco'){if(!S.reg.busy)enregistrerEcole();return}
  if(a==='rg-logo-del'){S.reg.eco.logo='';render(true);return}
  if(a==='msg-go'){const d=vueEvals().find(x=>x.id===b.dataset.id);if(!d)return;S.tab='messages';S.msg.classe=d.classe;S.msg.evalId=d.id;S.view='msg-dev';render(true);window.scrollTo(0,0);chargerMessages();return}
  if(a==='msgcl'){S.msg.classe=b.dataset.c;S.view=null;render(true);chargerMessages();return}
  if(a==='msg-dev'){S.msg.evalId=b.dataset.id;S.view='msg-dev';render(true);window.scrollTo(0,0);return}
  if(a==='msg-bul'){S.view='msg-bul';render(true);window.scrollTo(0,0);return}
  if(a==='msg-back'){S.view=null;render(true);window.scrollTo(0,0);return}
  if(a==='msg-vcf'){contactsVcf(S.msg.classe);return}
  if(a==='msg-img'){envoyerImage(b.dataset.k,b.dataset.eid);return}
  if(a==='msg-txt'){noterEnvoi(b.dataset.k,b.dataset.eid);return} // le lien ouvre WhatsApp
  if(a==='msg-suivi'){noterEnvoi('suivi',b.dataset.eid,{cle:b.dataset.cle,devs:b.dataset.devs?b.dataset.devs.split(','):[]});return}
  if(a==='bulcl'){S.bulClasse=b.dataset.c;render(true);chargerBulletins();return}
  if(a==='bul'){S.bulId=b.dataset.id;S.view='bulletin';render(true);window.scrollTo(0,0);return}
  if(a==='bul-close'){S.view=null;render(true);return}
  if(a==='def-new'){S.def.form={id:null,titre:'Examen blanc '+(S.def.exams.length+1),date:today()};S.def.err='';S.def.confirm=false;render(true);return}
  if(a==='def-edit'){const x=defExam(S.def.examId);if(x){S.def.form={id:x.id,titre:x.titre,date:x.date||''};S.def.err='';S.def.confirm=false;render(true)}return}
  if(a==='def-form-close'){S.def.form=null;S.def.err='';S.def.confirm=false;render(true);return}
  if(a==='def-form-save'){enregistrerDefExam();return}
  if(a==='def-del'){S.def.confirm=true;render(true);return}
  if(a==='def-del-no'){S.def.confirm=false;render(true);return}
  if(a==='def-del-yes'){supprimerDefExam();return}
  if(a==='def-x'){S.def.examId=b.dataset.x;render(true);return}
  if(a==='def-c'){S.def.classe=b.dataset.c;render(true);return}
  if(a==='def-maj'){S.def.charge=false;render(true);chargerDef();return}
  if(a==='def-print'){imprimerDef();return}
  if(a==='def-saisir'){ouvrirDefSaisie(b.dataset.x,b.dataset.c,b.dataset.m);return}
  if(a==='def-save'){enregistrerDefSaisie();return}
  if(a==='def-close'){const t=S.def.saisie&&S.def.saisie.tab;S.view=null;S.def.saisie=null;S.def.err='';if(t)S.tab=t;render(true);return}
  if(a==='stats-open'){S.view='stats';if(!S.statsP)S.statsP=S.trim;render(true);window.scrollTo(0,0);chargerToutesNotes();return}
  if(a==='stats-close'){S.view=null;render(true);window.scrollTo(0,0);return}
  if(a==='stats-p'){const v=b.dataset.p;S.statsP=v==='an'?'an':+v;render(true);return}
  if(a==='stats-maj'){chargerToutesNotes(true);return}
  if(a==='stats-print'){imprimerStats();return}
  if(a==='print'){const ctl=controle(S.bulClasse,S.trim);if(ctl.length&&!confirm('Des notes manquent encore en '+S.bulClasse+' ('+ctl.map(x=>x.m.nom).join(', ')+'). Les bulletins auront des moyennes provisoires. Imprimer quand même ?'))return;imprimer(+b.dataset.n);return}
  if(a==='print-one'){imprimer(1,S.bulId);return}
  if(a==='cours'){S.classe=b.dataset.c;S.matiere=b.dataset.m;saveSel();render(true);return}
  if(a==='trim'){S.trim=+b.dataset.t;saveSel();render(true);return}
  if(a==='new-devoir')return ouvrir('devoir');
  if(a==='edit')return ouvrir('devoir',b.dataset.id);
  if(a==='compo')return ouvrir('compo');
  if(a==='close'){S.view=null;S.draft=null;S.err='';render(true);return}
  if(a==='save')return enregistrer();
  if(a==='del'){S.confirm='del';render(true);return}
  if(a==='del-no'){S.confirm=null;render(true);return}
  if(a==='del-yes')return supprimer();
  if(a==='go-eleves'){S.tab='eleves';S.elClasse=b.dataset.c;S.view=null;render(true);window.scrollTo(0,0);return}
  if(a==='elcl'){S.elClasse=b.dataset.c;render(true);return}
  if(a==='cert-open')return ouvrirCert(b.dataset.id);
  if(a==='cert-close'){S.view=S.cert?S.cert.retour:null;S.cert=null;render(true);window.scrollTo(0,0);return}
  if(a==='cert-print'){imprimerCert();return}
  if(a==='el-new')return ouvrirEleve(null);
  if(a==='el-edit')return ouvrirEleve(b.dataset.id);
  if(a==='el-close'){S.view=S.elDraft&&S.tab==='messages'?S.vueAvant||null:null;S.elDraft=null;S.imp=null;S.confirm=null;S.err='';render(true);return}
  if(a==='el-save'){if(!S.busy)enregistrerEleve(false);return}
  if(a==='el-del'){S.confirm='el-del';render(true);return}
  if(a==='el-del-no'){S.confirm=null;render(true);return}
  if(a==='el-del-yes'){if(!S.busy)supprimerEleve();return}
  if(a==='el-import'){S.imp={classe:S.elClasse||CLASSES[0],texte:'',lignes:null};S.view='import';S.err='';render(true);window.scrollTo(0,0);return}
  if(a==='imp-check')return verifierImport();
  if(a==='imp-save'){if(!S.busy)enregistrerImport();return}
  if(a==='sync'){S.online=true;synchroniser();return}
  if(a==='retry'){const o=outbox(),p=o.find(x=>x.pid===b.dataset.pid);if(p){delete p.err;setOutbox(o);synchroniser()}return}
  if(a==='drop'){setOutbox(outbox().filter(x=>x.pid!==b.dataset.pid));render(true);return}
  if(a==='logout'){
    const n=outbox().filter(p=>!p.err).length;
    if(n&&!confirm(n+' saisie(s) ne sont pas encore envoyées. Si vous quittez maintenant, elles seront perdues. Quitter quand même ?'))return;
    await arreterPresence();lsDel(kCache());lsDel(kOut());lsDel(kSel());try{await sb.auth.signOut({scope:'local'})}catch(_){}
    location.reload();
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(S.reg.form&&(t.dataset.rg||t.dataset.rgniv||t.dataset.rgcoef)){regChamp(t);if(t.dataset.rg==='role')render(true);return}
  if(t.dataset.rgeco&&S.reg.eco){S.reg.eco[t.dataset.rgeco]=t.value;return}
  if(t.dataset.rglogo&&t.files&&t.files[0]){lireLogo(t.files[0]);return}
  if(t.dataset.actChange==='classe'){S.classe=t.value;const m=S.matieres.filter(x=>(x.niveaux||[]).includes(S.classe[0]));if(!m.some(x=>x.id===S.matiere))S.matiere=m[0]?m[0].id:null;saveSel();render(true);chargerSelection();return}
  if(t.dataset.actChange==='matiere'){S.matiere=t.value;saveSel();render(true);chargerSelection();return}
  if(t.dataset.cert&&S.cert){S.cert[t.dataset.cert]=t.value;if(S.cert.err)S.cert.err='';return}
  if(t.dataset.el&&S.elDraft){S.elDraft[t.dataset.el]=t.value;return}
  if(t.dataset.dfx&&S.def.form){S.def.form[t.dataset.dfx]=t.value;return}
  if(t.dataset.actChange==='impclasse'&&S.imp){S.imp.classe=t.value;S.imp.lignes=null;S.err='';render(true);return}
  if(t.dataset.actChange==='feedclasse'){S.feedClasse=t.value;S.feedAt=null;render(true);chargerFeed();return}
  if(t.dataset.disp&&S.draft){S.draft.vals[t.dataset.disp].disp=t.checked;render(true);return}
  if(t.dataset.d==='matiere'&&S.draft){S.draft.ev.matiere=t.value;render(true);return}
  if(t.dataset.actChange==='bulclasse'){S.bulClasse=t.value;S.view=null;render(true);chargerBulletins();return}
});
function regChamp(t){const f=S.reg.form;
  if(t.dataset.rg)f[t.dataset.rg]=t.type==='checkbox'?t.checked:t.value;
  else if(t.dataset.rgniv)f.niv[t.dataset.rgniv]=t.checked;
  else if(t.dataset.rgcoef)f.coef[t.dataset.rgcoef]=t.value}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(S.reg.form&&(t.dataset.rg||t.dataset.rgniv||t.dataset.rgcoef)){regChamp(t);return}
  if(t.dataset.rgeco&&S.reg.eco){S.reg.eco[t.dataset.rgeco]=t.value;return}
  if(t.dataset.cert&&S.cert){S.cert[t.dataset.cert]=t.value;if(S.cert.err)S.cert.err='';return}
  if(t.dataset.el&&S.elDraft){S.elDraft[t.dataset.el]=t.value;return}
  if(t.dataset.imp&&S.imp){S.imp.texte=t.value;return}
  if(t.dataset.dfx&&S.def.form){S.def.form[t.dataset.dfx]=t.value;return}
  if(t.dataset.dxn&&S.def.saisie){S.def.saisie.vals[t.dataset.dxn]=t.value;t.classList.toggle('bad',Number.isNaN(parseNote(t.value,20)));return}
  if(!S.draft)return;
  if(t.dataset.d){S.draft.ev[t.dataset.d]=t.value;return}
  const id=t.dataset.note||t.dataset.nc;if(!id)return;
  const v=S.draft.vals[id];if(t.dataset.note)v.note=t.value;else v.nc=t.value;
  const compo=S.draft.ev.type==='compo',p=parseNote(t.value,t.dataset.nc?20:(compo?40:20));
  t.classList.toggle('bad',Number.isNaN(p));
  if(compo){const m=document.getElementById('m-'+id);if(m)m.innerHTML=moyTxt(parseNote(v.nc,20),parseNote(v.note,40))}
});
async function chargerSelection(){
  if(!isBureau()||!S.online)return;
  const ids=S.evals.filter(e=>e.classe===S.classe&&e.matiere===S.matiere&&!S.notes[e.id]).map(e=>e.id);
  if(!ids.length)return;
  try{await chargerNotes(ids);saveCache();if(S.view!=='edit')render()}catch(e){if(estReseau(e)){S.online=false;render()}}
}

/* ===== Démarrage et mises à jour ===== */
async function rafraichir(){
  if(!sb||!S.uid)return;
  try{await chargerTout();demarrerPresence();chargerDef();await synchroniser();if(S.tab==='messages')chargerMessages()}
  catch(e){
    if(e.code==='PROFIL'){lsDel(kCache());await sb.auth.signOut({scope:'local'}).catch(()=>{});S.uid=null;S.profil=null;S.charge=false;S.err='Ce compte n\'a pas accès aux bulletins (ou il a été désactivé). Voyez la direction.'}
    else if(estReseau(e))S.online=false;
    else if(!S.charge){S.err=msgErreur(e)}
  }
  render();
}
async function demarrer(){
  if(!sb){render(true);return}
  const {data}=await sb.auth.getSession().catch(()=>({data:{}}));
  const s=data&&data.session;
  if(s&&s.user){S.uid=s.user.id;loadCache();choisirDefaut();render(true);rafraichir()}
  else render(true);
  sb.auth.onAuthStateChange((evt,sess)=>{if(evt==='SIGNED_OUT'&&S.uid&&!sess){S.uid=null;S.profil=null;S.charge=false;render(true)}});
}
window.addEventListener('online',()=>{S.online=true;renderHead();rafraichir()});
window.addEventListener('offline',()=>{S.online=false;renderHead()});
setInterval(()=>{if(document.visibilityState==='visible'&&S.uid&&isDir()&&S.tab==='direct')chargerFeed()},15000);
setInterval(()=>{if(document.visibilityState==='visible'&&S.uid&&!enFormulaire()&&navigator.onLine)rafraichir()},60000);
setInterval(()=>{if(S.uid&&navigator.onLine&&outbox().some(p=>!p.err))synchroniser()},30000);
document.addEventListener('visibilitychange',()=>{presenceSignal();if(document.visibilityState==='visible'&&S.uid&&navigator.onLine){synchroniser();if(S.tab==='direct')chargerFeed()}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
demarrer();
</script>
